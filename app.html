<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Safehouse — Predators Horizon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blood: #8b1a1a;
    --blood-hot: #ff3a3a;
    --blood-glow: #ff5a5a;
    --void: #050505;
    --void-2: #0a0a0b;
    --iron: #1a1616;
    --iron-2: #242020;
    --iron-3: #2e2929;
    --bone: #e8e4dc;
    --bone-dim: #b8b2a8;
    --ash: #6b6b73;
    --ok: #4ade80;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: var(--void);
    color: var(--bone);
    font-family: 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
    font-weight: 600;
    overflow: hidden;
  }
  button { font-family: inherit; font-weight: 700; cursor: pointer; border: none; background: none; color: inherit; }

  /* ═══════════════ LAYOUT ═══════════════ */
  .hub {
    position: fixed;
    inset: 0;
    display: grid;
    grid-template-columns: 88px 1fr;
    grid-template-rows: 64px 1fr;
    grid-template-areas:
      "sidebar topbar"
      "sidebar main";
    background:
      radial-gradient(ellipse at 30% 20%, rgba(139,26,26,0.10), transparent 55%),
      radial-gradient(ellipse at 80% 90%, rgba(74,13,13,0.08), transparent 50%),
      var(--void);
  }
  .hub::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(139,26,26,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(139,26,26,0.03) 1px, transparent 1px);
    background-size: 72px 72px;
    mask-image: radial-gradient(ellipse at center, black 20%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 20%, transparent 80%);
    opacity: 0.6;
  }

  /* ═══════════════ TOPBAR ═══════════════ */
  .topbar {
    grid-area: topbar;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    background: linear-gradient(180deg, rgba(5,5,5,0.92), rgba(5,5,5,0.6));
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--iron-3);
    z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { height: 40px; mix-blend-mode: screen; }
  .brand-name {
    display: none;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  @media (min-width: 720px) { .brand-name { display: block; } }
  .status { display: flex; align-items: center; gap: 20px; }
  .stat {
    display: flex; align-items: center; gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px; font-weight: 700;
  }
  .stat svg { width: 18px; height: 18px; color: var(--blood-hot); }
  .stat-label {
    font-size: 9px; letter-spacing: 0.16em;
    color: var(--ash); text-transform: uppercase;
  }
  .stat-value { color: var(--bone); }
  .xp {
    display: flex; align-items: center; gap: 12px;
    padding: 4px 12px 4px 4px;
    background: rgba(10,10,11,0.6);
    border: 1px solid var(--iron-3);
    border-radius: 999px;
  }
  .xp-ring { position: relative; width: 36px; height: 36px; }
  .xp-ring svg { transform: rotate(-90deg); }
  .xp-ring circle { fill: none; stroke-width: 3; stroke-linecap: round; }
  .xp-ring .bg { stroke: var(--iron-3); }
  .xp-ring .fg {
    stroke: var(--blood-hot);
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
    filter: drop-shadow(0 0 6px var(--blood-hot));
    transition: stroke-dashoffset 0.5s;
  }
  .xp-level {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px; font-weight: 900;
    color: var(--blood-hot);
  }
  .xp-meta { line-height: 1.2; }
  .xp-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.16em; text-transform: uppercase;
  }
  .xp-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--ash);
  }

  /* ═══════════════ SIDEBAR ═══════════════ */
  .sidebar {
    grid-area: sidebar;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 0;
    gap: 8px;
    background: linear-gradient(180deg, rgba(5,5,5,0.9), rgba(10,10,11,0.7));
    backdrop-filter: blur(14px);
    border-right: 1px solid var(--iron-3);
    z-index: 10;
  }
  .room-btn {
    position: relative;
    width: 60px; height: 60px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 3px;
    border-radius: 5px;
    color: var(--ash);
    transition: all 0.24s;
  }
  .room-btn svg { width: 24px; height: 24px; transition: all 0.24s; }
  .room-btn-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 8px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .room-btn:hover { color: var(--bone); background: rgba(139,26,26,0.08); }
  .room-btn:hover svg { stroke: var(--blood-hot); }
  .room-btn.active {
    color: var(--blood-hot);
    background: linear-gradient(180deg, rgba(139,26,26,0.18), rgba(74,13,13,0.10));
  }
  .room-btn.active svg {
    stroke: var(--blood-hot);
    filter: drop-shadow(0 0 8px rgba(255,58,58,0.6));
  }
  .room-btn.active::before {
    content: '';
    position: absolute;
    left: 0; top: 20%; bottom: 20%;
    width: 3px;
    background: var(--blood-hot);
    border-radius: 0 3px 3px 0;
    box-shadow: 0 0 12px var(--blood-hot);
  }
  .sidebar-footer {
    margin-top: auto;
    display: flex; flex-direction: column; gap: 8px;
    padding-top: 16px; border-top: 1px solid var(--iron-3);
    width: 60%;
  }

  /* ═══════════════ MAIN ═══════════════ */
  .main {
    grid-area: main;
    overflow-y: auto;
    padding: 32px 32px 64px;
    position: relative;
  }
  .main::-webkit-scrollbar { width: 10px; }
  .main::-webkit-scrollbar-track { background: var(--void-2); }
  .main::-webkit-scrollbar-thumb { background: var(--iron-2); border-radius: 999px; }

  .room { display: none; }
  .room.active { display: block; animation: roomIn 0.42s ease both; }
  @keyframes roomIn {
    from { opacity: 0; transform: translateX(16px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .room-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 24px; margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--iron-3);
    position: relative;
  }
  .room-head::after {
    content: '';
    position: absolute;
    left: 0; bottom: -1px;
    width: 84px; height: 2px;
    background: var(--blood-hot);
    box-shadow: 0 0 12px var(--blood-hot);
  }
  .room-kicker {
    font-family: 'Orbitron', sans-serif;
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--blood-hot);
    margin-bottom: 8px;
    text-shadow: 0 0 20px rgba(255,58,58,0.4);
  }
  .room-title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(24px, 3vw, 36px);
    font-weight: 900;
    letter-spacing: 0.16em; text-transform: uppercase;
    line-height: 1.1;
  }

  /* ═══════════════ CAROUSEL ═══════════════ */
  .carousel-wrap {
    position: relative;
    height: calc(100vh - 220px);
    min-height: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    perspective: 1400px;
    overflow: hidden;
  }

  /* Stage: the shelf the items sit on */
  .carousel-stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    transform-style: preserve-3d;
  }

  /* Item: absolute positioned so we can slide / scale each one */
  .c-item {
    position: absolute;
    top: 50%; left: 50%;
    width: 380px;
    height: 520px;
    transform-style: preserve-3d;
    transform-origin: center center;
    /* Position + scale set inline by JS on every render */
    transition:
      transform 0.55s cubic-bezier(0.2, 0.9, 0.2, 1),
      opacity 0.45s ease,
      filter 0.45s ease;
    pointer-events: none;
    will-change: transform, opacity;
  }
  .c-item.is-active { pointer-events: auto; }
  .c-item.is-clickable { pointer-events: auto; cursor: pointer; }

  /* The card itself */
  .c-card {
    position: relative;
    width: 100%; height: 100%;
    background: linear-gradient(160deg, #1a1616, #0a0a0b);
    border: 1px solid var(--iron-3);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .c-item.is-active .c-card {
    border-color: var(--blood-hot);
    box-shadow:
      0 0 40px rgba(255,58,58,0.35),
      0 20px 60px rgba(0,0,0,0.7);
  }

  /* Top scan lines + corner accents */
  .c-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,58,58,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,58,58,0.05) 1px, transparent 1px);
    background-size: 30px 30px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
    pointer-events: none;
  }

  /* Item name ribbon */
  .c-ribbon {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 10px 14px;
    background: linear-gradient(180deg, rgba(5,5,5,0.9), rgba(5,5,5,0));
    display: flex; align-items: center; justify-content: space-between;
    z-index: 3;
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .c-ribbon .tier {
    color: var(--blood-hot);
    padding: 3px 8px;
    border: 1px solid var(--blood);
    border-radius: 3px;
    background: rgba(139,26,26,0.15);
  }
  .c-ribbon .key-hint {
    color: var(--ash);
    font-family: 'JetBrains Mono', monospace;
  }

  /* SVG area for the item art */
  .c-art {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .c-art svg {
    width: 78%;
    height: 78%;
    transition: transform 0.55s cubic-bezier(0.2, 0.9, 0.2, 1);
  }
  .c-item.is-active .c-art svg {
    transform: scale(1.06);
  }
  /* Soft accent glow behind the art */
  .c-art::before {
    content: '';
    position: absolute;
    width: 70%; height: 70%;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, var(--accent, var(--blood)) 0%, transparent 70%);
    opacity: 0.16;
    filter: blur(30px);
    pointer-events: none;
  }

  /* Bottom info block */
  .c-info {
    padding: 16px 20px 20px;
    background: linear-gradient(180deg, transparent, rgba(5,5,5,0.85));
    border-top: 1px solid var(--iron-3);
    position: relative;
  }
  .c-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--bone);
    margin-bottom: 6px;
    line-height: 1.1;
  }
  .c-stats {
    display: flex;
    gap: 16px;
    margin-bottom: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
  }
  .c-stats span {
    color: var(--ash);
    text-transform: uppercase;
  }
  .c-stats strong {
    color: var(--bone);
    font-weight: 700;
  }
  .c-desc {
    font-size: 12px;
    color: var(--bone-dim);
    line-height: 1.5;
    min-height: 32px;
  }

  /* Locked overlay for unowned items */
  .c-item.is-locked .c-card::after {
    content: 'LOCKED';
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 0.4em;
    color: rgba(255,58,58,0.35);
    text-shadow: 0 0 20px rgba(255,58,58,0.4);
    z-index: 4;
    pointer-events: none;
  }
  .c-item.is-locked .c-card {
    filter: saturate(0.55);
  }

  /* Equipped badge */
  .c-item.is-equipped .c-card::before {
    /* keep grid background; the badge is separate */
  }
  .c-equipped-badge {
    position: absolute;
    top: 44px;
    right: 12px;
    padding: 4px 10px;
    background: var(--blood-hot);
    color: #fff;
    font-family: 'Orbitron', sans-serif;
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 0.2em;
    border-radius: 3px;
    box-shadow: 0 0 16px rgba(255,58,58,0.8);
    z-index: 5;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.7; }
  }

  /* Arrow buttons */
  .c-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 56px; height: 56px;
    border-radius: 50%;
    background: rgba(5,5,5,0.85);
    border: 1.5px solid var(--iron-3);
    color: var(--bone-dim);
    display: grid;
    place-items: center;
    z-index: 10;
    transition: all 0.24s;
    backdrop-filter: blur(10px);
  }
  .c-arrow svg { width: 22px; height: 22px; }
  .c-arrow:hover {
    border-color: var(--blood-hot);
    color: var(--blood-hot);
    box-shadow: 0 0 24px rgba(255,58,58,0.5);
    transform: translateY(-50%) scale(1.06);
  }
  .c-arrow:active { transform: translateY(-50%) scale(0.96); }
  .c-arrow.left  { left: 24px; }
  .c-arrow.right { right: 24px; }
  .c-arrow:disabled { opacity: 0.25; cursor: not-allowed; }
  .c-arrow:disabled:hover {
    border-color: var(--iron-3); color: var(--bone-dim);
    box-shadow: none; transform: translateY(-50%);
  }

  /* Dots / index strip */
  .c-dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 16px;
    flex-wrap: wrap;
    max-width: 640px;
  }
  .c-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--iron-3);
    cursor: pointer;
    transition: all 0.24s;
  }
  .c-dot:hover { background: var(--blood); }
  .c-dot.is-active {
    background: var(--blood-hot);
    box-shadow: 0 0 10px var(--blood-hot);
    width: 20px; border-radius: 3px;
  }
  .c-dot.is-owned { background: rgba(74,222,128,0.4); }
  .c-dot.is-owned:hover { background: var(--ok); }
  .c-dot.is-owned.is-active { background: var(--blood-hot); }

  /* Action bar below the carousel */
  .c-actionbar {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  .c-actionbar .price {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: rgba(5,5,5,0.6);
    border: 1px solid var(--iron-3);
    border-radius: 3px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--bone);
  }
  .c-actionbar .price.poor { color: var(--blood-hot); }
  .c-actionbar .price.owned { color: var(--ok); }

  /* Slot picker strip (arsenal only) */
  .slot-strip {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 12px;
  }
  .slot-chip {
    min-width: 44px;
    padding: 8px 12px;
    background: rgba(5,5,5,0.6);
    border: 1px solid var(--iron-3);
    border-radius: 3px;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: var(--bone-dim);
    letter-spacing: 0.08em;
    transition: all 0.2s;
  }
  .slot-chip:hover { border-color: var(--blood); color: var(--bone); }
  .slot-chip.is-active {
    background: linear-gradient(180deg, var(--blood), #4a0d0d);
    border-color: var(--blood-hot);
    color: #fff;
    box-shadow: 0 0 16px rgba(255,58,58,0.5);
  }

  /* ═══════════════ GENERIC BUTTONS ═══════════════ */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 24px;
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    border: 1.5px solid var(--blood-hot);
    background: linear-gradient(180deg, var(--blood), #4a0d0d);
    color: #fff;
    border-radius: 3px;
    box-shadow: 0 0 24px rgba(255,58,58,0.4);
    transition: all 0.24s;
    text-decoration: none;
  }
  .btn:hover {
    background: linear-gradient(180deg, var(--blood-hot), var(--blood));
    transform: translateY(-1px);
    box-shadow: 0 0 32px rgba(255,58,58,0.7);
  }
  .btn.lg { padding: 16px 40px; font-size: 14px; }
  .btn.ghost {
    background: transparent;
    border-color: var(--iron-3);
    color: var(--bone-dim);
    box-shadow: none;
  }
  .btn.ghost:hover {
    border-color: var(--blood-hot);
    color: var(--bone);
  }
  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  /* ═══════════════ DOOR ROOM ═══════════════ */
  .door {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 32px;
  }
  @media (max-width: 900px) { .door { grid-template-columns: 1fr; } }
  .door-hero {
    position: relative;
    padding: 40px;
    background:
      radial-gradient(ellipse at 30% 30%, rgba(139,26,26,0.28), transparent 60%),
      linear-gradient(160deg, #1a1616, #0a0a0b);
    border: 1px solid rgba(139,26,26,0.5);
    border-radius: 5px;
    overflow: hidden;
    min-height: 380px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .door-hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,58,58,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,58,58,0.06) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse at 40% 40%, black 20%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at 40% 40%, black 20%, transparent 75%);
    pointer-events: none;
  }
  .door-hero > * { position: relative; z-index: 2; }
  .door-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    background: rgba(5,5,5,0.6);
    border: 1px solid rgba(139,26,26,0.5);
    border-radius: 999px;
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--blood-hot);
    margin-bottom: 20px;
  }
  .door-badge::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--blood-hot);
    box-shadow: 0 0 10px var(--blood-hot);
    animation: pulse 1.8s ease-in-out infinite;
  }
  .door-title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(36px, 5vw, 64px);
    font-weight: 900;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    line-height: 1;
    margin-bottom: 16px;
  }
  .door-title span { color: var(--blood-hot); text-shadow: 0 0 40px rgba(255,58,58,0.6); }
  .door-lead {
    font-size: 15px;
    color: var(--bone-dim);
    line-height: 1.7;
    margin-bottom: 32px;
    max-width: 460px;
  }
  .door-cta { display: flex; gap: 12px; flex-wrap: wrap; }

  .panel {
    background: linear-gradient(160deg, var(--iron), var(--void-2));
    border: 1px solid var(--iron-3);
    border-radius: 5px;
    padding: 20px;
  }
  .panel-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--bone-dim);
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--iron-3);
  }

  .slots {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .slot {
    aspect-ratio: 1;
    background: rgba(5,5,5,0.6);
    border: 1px solid var(--iron-3);
    border-radius: 3px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.24s;
  }
  .slot:hover {
    border-color: var(--blood);
    background: rgba(139,26,26,0.08);
  }
  .slot.empty { border-style: dashed; }
  .slot.empty::after {
    content: '+';
    position: absolute;
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    color: var(--iron-3);
  }
  .slot-key {
    position: absolute;
    top: 3px; left: 5px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--ash);
    z-index: 2;
  }
  .slot svg { width: 70%; height: 70%; }

  .avatar {
    width: 100px; height: 100px;
    border-radius: 50%;
    background: rgba(5,5,5,0.6);
    border: 2px solid var(--blood);
    overflow: hidden;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 30px rgba(255,58,58,0.2);
  }
  .avatar svg { width: 90%; height: 90%; }

  /* ═══════════════ PROFILE / TERMINAL ═══════════════ */
  .profile-card {
    background: linear-gradient(160deg, var(--iron), var(--void-2));
    border: 1px solid var(--iron-3);
    border-radius: 5px;
    padding: 24px;
    margin-bottom: 16px;
  }
  .profile-identity {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .p-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag {
    padding: 3px 10px;
    border: 1px solid var(--iron-3);
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ash);
    text-transform: uppercase;
  }
  .tag.guest { border-color: #fbbf24; color: #fbbf24; }

  .term-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px dashed rgba(139,26,26,0.15);
  }
  .term-row:last-child { border-bottom: none; }
  .term-label {
    font-size: 11px;
    color: var(--ash);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .term-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--bone);
  }

  .empty {
    padding: 40px 24px;
    text-align: center;
    color: var(--ash);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    text-transform: uppercase;
    border: 1px dashed var(--iron-3);
    border-radius: 5px;
  }

  .toasts {
    position: fixed;
    bottom: 24px; right: 24px;
    z-index: 500;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  .toast {
    padding: 12px 20px;
    background: linear-gradient(160deg, var(--iron-2), var(--void-2));
    border: 1px solid rgba(139,26,26,0.5);
    border-left: 3px solid var(--blood-hot);
    border-radius: 3px;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    animation: toastIn 0.24s ease both;
    max-width: 320px;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(20px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  @media (max-width: 900px) {
    .c-item { width: 300px; height: 440px; }
    .c-name { font-size: 18px; }
    .c-arrow { width: 44px; height: 44px; }
    .c-arrow.left { left: 12px; }
    .c-arrow.right { right: 12px; }
  }
  @media (max-width: 720px) {
    .hub { grid-template-columns: 60px 1fr; }
    .main { padding: 20px 16px 48px; }
    .door-hero { padding: 24px; min-height: auto; }
    .c-item { width: 260px; height: 400px; }
  }

  var terrainShapes = {

  /* ═══════════════ XP / LEVEL ═══════════════ */
  function xpForLevel(level) {
    if (level <= 1) return 0;
    var total = 0, cost = 120;
    for (var i = 2; i <= level; i++) { total += cost; cost = Math.round(cost * 1.32); }
    return total;
  }
  function levelInfo(xp) {
    var level = 1;
    while (level < 99 && xp >= xpForLevel(level + 1)) level++;
    var floor = xpForLevel(level);
    var next = xpForLevel(level + 1);
    return { level: level, into: xp - floor, need: next - floor };
  }

  /* ── Toast ── */
  function toast(msg) {
    var layer = $('toasts');
    var t = el('div', 'toast', esc(msg));
    layer.appendChild(t);
    setTimeout(function () {
      t.style.transition = 'opacity 0.24s, transform 0.24s';
      t.style.opacity = '0';
      t.style.transform = 'translateX(20px)';
      setTimeout(function () { t.remove(); }, 260);
    }, 2400);
  }

  function persist() {
    if (!state.save) return;
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(state.save)); }
    catch (e) { toast('Could not save'); }
  }

  /* ── Topbar ── */
  function refreshTopbar() {
    var op = state.op;
    if (!op) return;
    $('creditsEl').textContent = fmtCoins(op.credits);
    $('nameEl').textContent = op.name;
    var lvl = levelInfo(op.xp);
    $('levelEl').textContent = lvl.level;
    $('xpSubEl').textContent = lvl.into + ' / ' + lvl.need + ' XP';
    $('xpRing').style.strokeDashoffset = String(100 - (lvl.need ? lvl.into / lvl.need : 0) * 100);
  }

  /* ── Sidebar ── */
  function renderSidebar() {
    var sb = $('sidebar');
    sb.innerHTML = '';
    ROOMS.forEach(function (room) {
      var btn = el('button', 'room-btn' + (room.id === state.room ? ' active' : ''));
      btn.title = room.title;
      btn.innerHTML =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + room.icon + '</svg>' +
        '<span class="room-btn-label">' + room.label + '</span>';
      btn.addEventListener('click', function () { showRoom(room.id); });
      sb.appendChild(btn);
    });
    var footer = el('div', 'sidebar-footer');
    footer.innerHTML =
      '<button class="room-btn" title="Sign Out" id="signOutBtn">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M9 21 H5 a2 2 0 0 1-2-2 V5 a2 2 0 0 1 2-2 h4 M16 17 l5-5-5-5 M21 12 H9"/>' +
        '</svg>' +
        '<span class="room-btn-label">Exit</span>' +
      '</button>';
    footer.querySelector('#signOutBtn').addEventListener('click', function () {
      if (!confirm('Sign out? Your progress is saved.')) return;
      clearSession();
      window.location.href = 'login-s.html';
    });
    sb.appendChild(footer);
  }

  /* ── Room routing ── */
  function showRoom(id) {
    if (state.room !== id && state.carouselIndex[id] == null && (id === 'arsenal' || id === 'locker' || id === 'maps')) {
      state.carouselIndex[id] = 0;
    }
    state.room = id;
    renderSidebar();
    var main = $('main');
    main.style.opacity = '0';
    setTimeout(function () {
      main.innerHTML = renderRoom(id);
      wireRoom(id);
      main.style.transition = 'opacity 0.24s';
      main.style.opacity = '1';
    }, 60);
  }

  function renderRoom(id) {
    if (id === 'door') return renderDoor();
    if (id === 'arsenal') return renderCarouselRoom('arsenal');
    if (id === 'locker') return renderCarouselRoom('locker');
    if (id === 'maps') return renderCarouselRoom('maps');
    if (id === 'terminal') return renderTerminal();
    if (id === 'mirror') return renderMirror();
    return '';
  }

  /* ═══════════════ DOOR ROOM ═══════════════ */
  function renderDoor() {
    var op = state.op;
    var loadout = op.loadout;

    var slotsHtml = '';

      var wid = loadout.weapons[i];
      var w = wid != null ? WEAPONS[wid] : null;

        '<div class="slot' + (w ? '' : ' empty') + '" data-slot="' + i + '" title="' + (w ? esc(w.name) : 'Empty') + '">' +
          '<span class="slot-key">' + (i + 1) + '</span>' +
          (w ? weaponSvg(w) : '') +

            '</div>' +

              '<div>' +

  /* ═══════════════ CAROUSEL ROOM ═══════════════ */
  function renderCarouselRoom(id) {
    var cfg = getCarouselConfig(id);
    var items = cfg.items;
    var idx = state.carouselIndex[id] || 0;
    var kicker = '', title = '', cta = '';
    if (id === 'arsenal') { kicker = 'Weapon Systems'; title = 'The Arsenal'; }
    if (id === 'locker') { kicker = 'Operator Skins'; title = 'The Locker'; }
    if (id === 'maps') { kicker = 'Terrain Selection'; title = 'The Map Room'; }

    if (id === 'arsenal') {
      slotStrip = '<div class="slot-strip" id="slotStrip">';

  function getCarouselConfig(id) {
    if (id === 'arsenal') {
      return {
        items: WEAPONS,
        isOwned: function (w) { return state.op.unlockedWeapons.indexOf(w.id) >= 0; },
        isEquipped: function (w) { return state.op.loadout.weapons.indexOf(w.id) >= 0; },
        svg: weaponSvg,
        priceLabel: function (w) { return w.cost === 0 ? 'FREE' : fmtCoins(w.cost); },
        stats: function (w) { return '<span>TIER <strong>' + w.tier + '</strong></span><span>DPS <strong>' + w.dps + '</strong></span>'; },
        onUnlock: function (w) {
          if (state.op.credits < w.cost) { toast('Not enough credits'); return; }
          state.op.credits -= w.cost;
          state.op.unlockedWeapons.push(w.id);
          persist(); refreshTopbar();
          toast(w.name + ' unlocked');
          rerenderCarousel('arsenal');
        },
        onEquip: function (w) {
          var i = state.op.loadout.weapons.indexOf(w.id);
          if (i >= 0) state.op.loadout.weapons.splice(i, 1);
          state.op.loadout.weapons[state.selectedSlot] = w.id;
          while (state.op.loadout.weapons.length && state.op.loadout.weapons[state.op.loadout.weapons.length - 1] == null) {
            state.op.loadout.weapons.pop();
          }
          persist();
          toast(w.name + ' equipped to slot ' + (state.selectedSlot + 1));
          rerenderCarousel('arsenal');
        },
        onUnequip: function (w) {
          var i = state.op.loadout.weapons.indexOf(w.id);
          if (i >= 0) state.op.loadout.weapons.splice(i, 1);
          persist();
          toast(w.name + ' unequipped');
          rerenderCarousel('arsenal');
        },
        actionLabel: function (w) {
          if (state.op.loadout.weapons.indexOf(w.id) >= 0) return 'UNEQUIP';
          return 'EQUIP TO SLOT ' + (state.selectedSlot + 1);
        }
      };
    }
    if (id === 'locker') {
      return {
        items: SKINS,
        isOwned: function (s) { return state.op.unlockedSkins.indexOf(s.id) >= 0; },
        isEquipped: function (s) { return state.op.loadout.skin === s.id; },
        svg: skinSvg,
        priceLabel: function (s) { return s.cost === 0 ? 'FREE' : fmtCoins(s.cost); },

        onUnlock: function (s) {

          persist();
          toast(s.name + ' equipped');
          rerenderCarousel('locker');
        },
        actionLabel: function () { return 'EQUIP'; }
      };
    }
    if (id === 'maps') {
      return {
        items: TERRAINS,
        isOwned: function (t) { return state.op.unlockedTerrains.indexOf(t.id) >= 0; },
        isEquipped: function (t) { return state.op.loadout.terrain === t.id; },
        svg: terrainSvg,
        priceLabel: function (t) { return t.cost === 0 ? 'FREE' : fmtCoins(t.cost); },
        stats: function (t) { return '<span>TIER <strong>' + t.tier + '</strong></span><span>LAYOUT <strong>' + t.layout.toUpperCase() + '</strong></span>'; },
        onUnlock: function (t) {

          state.op.credits -= t.cost;

  function rerenderCarousel(id) {
    var stage = $('cStage');
    if (!stage) return;
    renderCarouselItems(id);
    renderCarouselDots(id);
    renderCarouselAction(id);
    updateSlotStrip();
  }

  function updateSlotStrip() {
    var strip = $('slotStrip');
    if (!strip) return;
    qsa('.slot-chip', strip).forEach(function (chip) {
      var i = parseInt(chip.dataset.slotPick, 10);
      chip.classList.toggle('is-active', i === state.selectedSlot);
      var wid = state.op.loadout.weapons[i];
      var w = wid != null ? WEAPONS[wid] : null;
      chip.textContent = (i + 1) + (w ? ' ' + w.glyph : '');
    });
  }

  function renderCarouselItems(id) {
    var stage = $('cStage');
    if (!stage) return;
    var cfg = getCarouselConfig(id);
    var items = cfg.items;
    var idx = state.carouselIndex[id] || 0;

    stage.innerHTML = '';

    items.forEach(function (item, i) {
      var offset = i - idx;
      var abs = Math.abs(offset);
      if (abs > 3) return; /* only render the visible window */

      var owned = cfg.isOwned(item);
      var equipped = cfg.isEquipped(item);

      var wrapper = el('div', 'c-item' + (abs === 0 ? ' is-active' : '') + (abs > 0 ? ' is-clickable' : '') + (owned ? '' : ' is-locked') + (equipped ? ' is-equipped' : ''));
      wrapper.dataset.index = i;
      wrapper.style.setProperty('--accent', item.accent || '#ff3a3a');

      /* Position formula:
         - Active item: centered, full size
         - Neighbors: pushed left/right, scaled down, lower opacity
         - Further: even smaller, more transparent */
      var x = offset * 380;
      var scale = abs === 0 ? 1 : abs === 1 ? 0.76 : 0.58;
      var rotateY = offset === 0 ? 0 : offset > 0 ? -22 : 22;
      var z = abs === 0 ? 0 : -Math.min(abs * 160, 320);
      var opacity = abs === 0 ? 1 : abs === 1 ? 0.62 : 0.28;

      wrapper.style.transform =
        'translate(-50%, -50%) ' +
        'translateX(' + x + 'px) ' +
        'translateZ(' + z + 'px) ' +
        'rotateY(' + rotateY + 'deg) ' +
        'scale(' + scale + ')';
      wrapper.style.opacity = String(opacity);
      wrapper.style.zIndex = String(100 - abs);

      var statsHtml = cfg.stats(item);

      wrapper.innerHTML =
        '<div class="c-card">' +
          (equipped ? '<div class="c-equipped-badge">EQUIPPED</div>' : '') +
          '<div class="c-ribbon">' +
            '<span class="tier">TIER ' + item.tier + '</span>' +
            '<span class="key-hint">' + (i + 1) + ' / ' + items.length + '</span>' +
          '</div>' +
          '<div class="c-art">' + cfg.svg(item) + '</div>' +
          '<div class="c-info">' +
            '<div class="c-name">' + esc(item.name) + '</div>' +
            '<div class="c-stats">' + statsHtml + '</div>' +
            '<div class="c-desc">' + esc(item.desc) + '</div>' +
          '</div>' +
        '</div>';

      /* Click on a neighbor to jump to it */
      wrapper.addEventListener('click', function (e) {
        if (abs === 0) return;
        /* If it's a neighbor, jump to that index */
        e.stopPropagation();
        goToIndex(id, i);
      });

      stage.appendChild(wrapper);
    });

    /* Update arrow disabled states */
    var prev = $('cPrev'), next = $('cNext');
    if (prev) prev.disabled = idx <= 0;
    if (next) next.disabled = idx >= items.length - 1;
  }

  function renderCarouselDots(id) {
    var dots = $('cDots');
    if (!dots) return;
    var cfg = getCarouselConfig(id);
    var items = cfg.items;
    var idx = state.carouselIndex[id] || 0;
    dots.innerHTML = '';
    items.forEach(function (item, i) {
      var owned = cfg.isOwned(item);
      var d = el('div', 'c-dot' + (i === idx ? ' is-active' : '') + (owned ? ' is-owned' : ''));
      d.title = item.name;
      d.addEventListener('click', function () { goToIndex(id, i); });
      dots.appendChild(d);
    });
  }

  function renderCarouselAction(id) {
    var bar = $('cAction');
    if (!bar) return;
    var cfg = getCarouselConfig(id);
    var items = cfg.items;
    var idx = state.carouselIndex[id] || 0;
    var item = items[idx];
    var owned = cfg.isOwned(item);
    var equipped = cfg.isEquipped(item);
    var canAfford = state.op.credits >= item.cost;

    bar.innerHTML = '';

    /* Price tag */
    var price = el('span', 'price' + (owned ? ' owned' : canAfford ? '' : ' poor'),
      owned ? 'OWNED' : cfg.priceLabel(item));
    bar.appendChild(price);

    if (!owned) {
      var unlock = el('button', 'btn', 'UNLOCK');
      if (!canAfford) unlock.disabled = true;
      unlock.addEventListener('click', function () { cfg.onUnlock(item); });
      bar.appendChild(unlock);
    } else if (equipped) {
      var unequip = el('button', 'btn ghost', id === 'arsenal' ? 'UNEQUIP' : 'EQUIPPED');
      if (id !== 'arsenal') unequip.disabled = true;
      else unequip.addEventListener('click', function () { cfg.onUnequip(item); });
      bar.appendChild(unequip);
    } else {
      var equip = el('button', 'btn', cfg.actionLabel(item));
      equip.addEventListener('click', function () { cfg.onEquip(item); });
      bar.appendChild(equip);
    }

    /* Slot shortcuts for arsenal */
    if (id === 'arsenal') {
      var slotHint = el('span', 'price', 'SLOT ' + (state.selectedSlot + 1));
      bar.appendChild(slotHint);
    }
  }

  function goToIndex(id, i) {
    var cfg = getCarouselConfig(id);
    var len = cfg.items.length;
    if (i < 0) i = 0;
    if (i >= len) i = len - 1;
    state.carouselIndex[id] = i;
    renderCarouselItems(id);
    renderCarouselDots(id);
    renderCarouselAction(id);
    playStepSound();
  }

  /* A subtle audio pulse when stepping through the carousel.
     Uses the Web Audio API directly; no files. */
  var _audioCtx = null;
  function playStepSound() {
    if (!state.op || !state.op.settings.sfx) return;
    try {
      if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (_audioCtx.state === 'suspended') _audioCtx.resume();
      var o = _audioCtx.createOscillator();
      var g = _audioCtx.createGain();
      o.type = 'triangle';
      o.frequency.value = 620;
      g.gain.setValueAtTime(0.0001, _audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.022, _audioCtx.currentTime + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, _audioCtx.currentTime + 0.09);
      o.connect(g); g.connect(_audioCtx.destination);
      o.start(); o.stop(_audioCtx.currentTime + 0.1);
    } catch (e) {}
  }

  function wireCarousel(id) {
    var prev = $('cPrev'), next = $('cNext');
    if (prev) prev.addEventListener('click', function () { goToIndex(id, (state.carouselIndex[id] || 0) - 1); });
    if (next) next.addEventListener('click', function () { goToIndex(id, (state.carouselIndex[id] || 0) + 1); });

    /* Keyboard nav */
    var keyHandler = function (e) {
      if (state.room !== id) return;
      if (e.key === 'ArrowLeft') { e.preventDefault(); goToIndex(id, (state.carouselIndex[id] || 0) - 1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); goToIndex(id, (state.carouselIndex[id] || 0) + 1); }
    };
    document.addEventListener('keydown', keyHandler);

    /* Touch / trackpad swipe */
    var startX = null;
    var wrap = $('carousel');
    if (wrap) {
      wrap.addEventListener('touchstart', function (e) {
        startX = e.touches[0].clientX;
      }, { passive: true });
      wrap.addEventListener('touchend', function (e) {
        if (startX == null) return;
        var dx = e.changedTouches[0].clientX - startX;
        startX = null;
        if (Math.abs(dx) < 50) return;
        var cur = state.carouselIndex[id] || 0;
        goToIndex(id, cur + (dx < 0 ? 1 : -1));
      }, { passive: true });
    }

    /* Initial render */
    renderCarouselItems(id);
    renderCarouselDots(id);
    renderCarouselAction(id);

    /* Slot chips for arsenal */
    qsa('[data-slot-pick]').forEach(function (chip) {
      chip.addEventListener('click', function () {
        state.selectedSlot = parseInt(chip.dataset.slotPick, 10);
        updateSlotStrip();
        renderCarouselAction(id);
      });
    });
  }

  /* ═══════════════ TERMINAL ═══════════════ */
  function renderTerminal() {
    var op = state.op;
    var s = op.stats;
    var lvl = levelInfo(op.xp);
    var rows = [
      ['Operator Level', lvl.level + ' (' + lvl.into + ' / ' + lvl.need + ' XP)'],
      ['Lifetime Runs', s.runs], ['Lifetime Kills', s.totalKills], ['Lifetime Score', s.totalScore],
      ['Best Score', s.bestScore], ['Best Wave', s.bestWave], ['Time Played', fmtTime(s.totalTime)],
      ['Deaths', s.deaths], ['Wins', s.wins]
    ].map(function (r) {
      return '<div class="term-row"><span class="term-label">' + r[0] + '</span><span class="term-value">' + r[1] + '</span></div>';
    }).join('');
    var history = op.history && op.history.length
      ? op.history.slice(0, 10).map(function (h) {
          return '<div class="term-row">' +
            '<span class="term-label">' + (h.mode || 'RUN') + (h.level ? ' · L' + h.level : '') + ' · ' + new Date(h.date).toLocaleDateString() + '</span>' +
            '<span class="term-value">' + (h.score || 0) + ' pts · ' + (h.kills || 0) + ' kills</span>' +
          '</div>';
        }).join('')
      : '<div class="empty">No runs recorded yet</div>';
    return '' +
      '<section class="room active">' +
        '<div class="room-head">' +
          '<div><div class="room-kicker">Record & Log</div><h2 class="room-title">The Terminal</h2></div>' +
        '</div>' +
        '<div class="panel" style="margin-bottom:16px">' +
          '<div class="panel-title">Statistics</div>' + rows +
        '</div>' +
        '<div class="panel">' +
          '<div class="panel-title">Recent Runs</div>' + history +
        '</div>' +
      '</section>';
  }

  /* ═══════════════ MIRROR ═══════════════ */
  function renderMirror() {
    var op = state.op;
    var skin = SKINS[op.loadout.skin] || SKINS[0];
    var lvl = levelInfo(op.xp);
    return '' +
      '<section class="room active">' +
        '<div class="room-head">' +
          '<div><div class="room-kicker">Operator Profile</div><h2 class="room-title">The Mirror</h2></div>' +
        '</div>' +
        '<div class="profile-card">' +
          '<div class="profile-identity">' +
            '<div class="avatar" style="border-color:' + skin.accent + '">' + skinSvg(skin) + '</div>' +
            '<div>' +
              '<div class="p-name">' + esc(op.name) + '</div>' +
              '<div class="tags">' +
                (op.guest ? '<span class="tag guest">Guest</span>' : '') +
                '<span class="tag">Level ' + lvl.level + '</span>' +
                '<span class="tag">' + skin.name + '</span>' +
                '<span class="tag">' + fmtCoins(op.credits) + '</span>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="panel" style="margin-top:16px">' +
          '<div class="panel-title">Danger Zone</div>' +
          '<button class="btn ghost" id="deleteBtn" style="border-color:#ff3a3a;color:#ff3a3a">Delete Operator</button>' +
        '</div>' +
      '</section>';
  }

  /* ═══════════════ WIRING ═══════════════ */
  function wireRoom(id) {
    if (id === 'door') wireDoor();
    else if (id === 'terminal') wireTerminal();
    else if (id === 'mirror') wireMirror();
    else if (id === 'arsenal' || id === 'locker' || id === 'maps') wireCarousel(id);
  }

  function wireDoor() {
    var play = $('playBtn');
    if (play) play.addEventListener('click', function () {
      if (!state.op.loadout.weapons.length) {
        toast('Equip a weapon first');
        showRoom('arsenal');
        return;
      }
      toast('Deploying…');
      setTimeout(function () { window.location.href = 'play.html'; }, 500);
    });
    var endless = $('endlessBtn');
    if (endless) endless.addEventListener('click', function () {
      state.op.settings.mode = 'endless';
      persist();
      toast('Entering Endless Loop…');
      setTimeout(function () { window.location.href = 'play.html'; }, 500);
    });
    qsa('.slot').forEach(function (s) {
      s.addEventListener('click', function () {
        state.selectedSlot = parseInt(s.dataset.slot, 10) || 0;
        showRoom('arsenal');
      });
    });
  }

  function wireTerminal() {}
  function wireMirror() {
    var b = $('deleteBtn');
    if (b) b.addEventListener('click', function () {
      if (!confirm('Permanently delete ' + state.op.name + '?')) return;
      delete state.save.operators[state.op.name];
      if (state.save.lastOperator === state.op.name) state.save.lastOperator = null;
      persist(); clearSession();
      window.location.href = 'login-s.html';
    });
  }

  /* ═══════════════ BOOT ═══════════════ */
  function boot() {
    var session = loadSession();
    if (!session || !session.name) {
      console.warn('No session — redirecting');
      window.location.href = 'login-s.html';
      return;
    }
    var save = loadSave();
    var op = save.operators[session.name];
    if (!op) {
      console.warn('Session operator missing');
      clearSession();
      window.location.href = 'login-s.html';
      return;
    }

    /* Defensive defaults */
    if (!op.unlockedWeapons) op.unlockedWeapons = [0];
    if (!op.unlockedSkins) op.unlockedSkins = [0];
    if (!op.unlockedTerrains) op.unlockedTerrains = [0];
    if (!op.loadout) op.loadout = { weapons: [0], skin: 0, terrain: 0 };
    if (!op.loadout.weapons) op.loadout.weapons = [0];
    if (op.loadout.skin == null) op.loadout.skin = 0;
    if (op.loadout.terrain == null) op.loadout.terrain = 0;
    if (!op.stats) op.stats = { runs: 0, kills: 0, deaths: 0, wins: 0, bestScore: 0, bestWave: 0, bestTime: 0, totalTime: 0, totalScore: 0, totalKills: 0, bossesKilled: 0, shotsFired: 0, damageDealt: 0, dashes: 0, pickups: 0, levelsCleared: 0 };
    if (!op.endless) op.endless = { bestWave: 0, bestScore: 0, bestLevel: 1, runs: 0 };
    if (!op.history) op.history = [];
    if (!op.awards) op.awards = [];
    if (!op.settings) op.settings = { sfx: true, music: false, shake: 1, difficulty: 0, mode: 'large', theme: 'city' };

    state.save = save;
    state.op = op;
    op.lastSeen = Date.now();
    persist();

    renderSidebar();
    refreshTopbar();
    showRoom('door');
    console.log('Hub booted for operator:', op.name);
  }

  boot();
})();
</script>
</body>
