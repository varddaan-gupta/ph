<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Safehouse — Predators Horizon</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #050505;
    color: #e8e4dc;
    font-family: 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
    font-weight: 600;
    overflow: hidden;
  }

  /* ═══════════ LAYOUT ═══════════ */
  .hub {
    position: fixed;
    inset: 0;
    display: grid;
    grid-template-columns: 88px 1fr;
    grid-template-rows: 64px 1fr;
    grid-template-areas:
      "sidebar topbar"
      "sidebar main";
    background:
      radial-gradient(ellipse at 30% 20%, rgba(139,26,26,0.10), transparent 55%),
      radial-gradient(ellipse at 80% 90%, rgba(74,13,13,0.08), transparent 50%),
      #050505;
  }
  .hub::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(139,26,26,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(139,26,26,0.03) 1px, transparent 1px);
    background-size: 72px 72px;
    mask-image: radial-gradient(ellipse at center, black 20%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 20%, transparent 80%);
    opacity: 0.6;
  }

  /* ═══════════ TOPBAR ═══════════ */
  .topbar {
    grid-area: topbar;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    background: linear-gradient(180deg, rgba(5,5,5,0.92), rgba(5,5,5,0.6));
    backdrop-filter: blur(14px);
    border-bottom: 1px solid #2a2422;
    z-index: 10;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand img {
    height: 40px;
    mix-blend-mode: screen;
  }
  .brand-name {
    display: none;
    font-family: 'Orbitron', 'Segoe UI', sans-serif;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  @media (min-width: 720px) { .brand-name { display: block; } }
  .status {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .stat {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: monospace;
    font-size: 13px;
    font-weight: 700;
  }
  .stat svg {
    width: 18px; height: 18px;
    color: #ff3a3a;
    flex-shrink: 0;
  }
  .stat-label {
    font-size: 9px;
    letter-spacing: 0.16em;
    color: #6b6b73;
    text-transform: uppercase;
  }
  .stat-value { color: #e8e4dc; }
  .xp {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 4px 12px 4px 4px;
    background: rgba(10,10,11,0.6);
    border: 1px solid #2a2422;
    border-radius: 999px;
  }
  .xp-ring {
    position: relative;
    width: 36px; height: 36px;
  }
  .xp-ring svg { transform: rotate(-90deg); }
  .xp-ring circle {
    fill: none;
    stroke-width: 3;
    stroke-linecap: round;
  }
  .xp-ring .bg { stroke: #2e2929; }
  .xp-ring .fg {
    stroke: #ff3a3a;
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
    filter: drop-shadow(0 0 6px #ff3a3a);
    transition: stroke-dashoffset 0.5s;
  }
  .xp-level {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 900;
    color: #ff3a3a;
  }
  .xp-meta { line-height: 1.2; }
  .xp-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .xp-sub {
    font-family: monospace;
    font-size: 10px;
    color: #6b6b73;
  }

  /* ═══════════ SIDEBAR ═══════════ */
  .sidebar {
    grid-area: sidebar;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 0;
    gap: 8px;
    background: linear-gradient(180deg, rgba(5,5,5,0.9), rgba(10,10,11,0.7));
    backdrop-filter: blur(14px);
    border-right: 1px solid #2a2422;
    z-index: 10;
  }
  .room-btn {
    position: relative;
    width: 60px; height: 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    border-radius: 5px;
    color: #6b6b73;
    background: none;
    border: none;
    cursor: pointer;
    transition: all 0.24s;
    font-family: inherit;
  }
  .room-btn svg {
    width: 24px; height: 24px;
    transition: all 0.24s;
  }
  .room-btn-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .room-btn:hover {
    color: #e8e4dc;
    background: rgba(139,26,26,0.08);
  }
  .room-btn:hover svg { stroke: #ff3a3a; }
  .room-btn.active {
    color: #ff3a3a;
    background: linear-gradient(180deg, rgba(139,26,26,0.18), rgba(74,13,13,0.10));
  }
  .room-btn.active svg {
    stroke: #ff3a3a;
    filter: drop-shadow(0 0 8px rgba(255,58,58,0.6));
  }
  .room-btn.active::before {
    content: '';
    position: absolute;
    left: 0; top: 20%; bottom: 20%;
    width: 3px;
    background: #ff3a3a;
    border-radius: 0 3px 3px 0;
    box-shadow: 0 0 12px #ff3a3a;
  }
  .sidebar-footer {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid #2a2422;
    width: 60%;
  }

  /* ═══════════ MAIN ═══════════ */
  .main {
    grid-area: main;
    overflow-y: auto;
    padding: 32px 32px 64px;
    position: relative;
  }
  .main::-webkit-scrollbar { width: 10px; }
  .main::-webkit-scrollbar-track { background: #0a0a0b; }
  .main::-webkit-scrollbar-thumb { background: #242020; border-radius: 999px; }

  .room { display: none; }
  .room.active { display: block; animation: roomIn 0.42s ease both; }
  @keyframes roomIn {
    from { opacity: 0; transform: translateX(16px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .room-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 32px;
    padding-bottom: 20px;
    border-bottom: 1px solid #2a2422;
    position: relative;
  }
  .room-head::after {
    content: '';
    position: absolute;
    left: 0; bottom: -1px;
    width: 84px; height: 2px;
    background: #ff3a3a;
    box-shadow: 0 0 12px #ff3a3a;
  }
  .room-kicker {
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #ff3a3a;
    margin-bottom: 8px;
    text-shadow: 0 0 20px rgba(255,58,58,0.4);
  }
  .room-title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(24px, 3vw, 36px);
    font-weight: 900;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    line-height: 1.1;
  }
  .room-sub {
    font-size: 15px;
    color: #b8b2a8;
    margin-top: 8px;
    max-width: 640px;
    line-height: 1.6;
  }

  /* ═══════════ DOOR ROOM ═══════════ */
  .door {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 32px;
  }
  @media (max-width: 900px) { .door { grid-template-columns: 1fr; } }
  .door-hero {
    position: relative;
    padding: 40px;
    background:
      radial-gradient(ellipse at 30% 30%, rgba(139,26,26,0.28), transparent 60%),
      linear-gradient(160deg, #1a1616, #0a0a0b);
    border: 1px solid rgba(139,26,26,0.5);
    border-radius: 5px;
    overflow: hidden;
    min-height: 380px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .door-hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,58,58,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,58,58,0.06) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse at 40% 40%, black 20%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at 40% 40%, black 20%, transparent 75%);
    pointer-events: none;
  }
  .door-hero > * { position: relative; z-index: 2; }
  .door-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    background: rgba(5,5,5,0.6);
    border: 1px solid rgba(139,26,26,0.5);
    border-radius: 999px;
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #ff3a3a;
    margin-bottom: 20px;
  }
  .door-badge::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #ff3a3a;
    box-shadow: 0 0 10px #ff3a3a;
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.4; transform: scale(0.8); }
  }
  .door-title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(36px, 5vw, 64px);
    font-weight: 900;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    line-height: 1;
    margin-bottom: 16px;
  }
  .door-title span { color: #ff3a3a; text-shadow: 0 0 40px rgba(255,58,58,0.6); }
  .door-lead {
    font-size: 15px;
    color: #b8b2a8;
    line-height: 1.7;
    margin-bottom: 32px;
    max-width: 460px;
  }
  .door-cta { display: flex; gap: 12px; flex-wrap: wrap; }

  /* ── Panels ── */
  .panel {
    background: linear-gradient(160deg, #1a1616, #0a0a0b);
    border: 1px solid #2a2422;
    border-radius: 5px;
    padding: 20px;
  }
  .panel-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #b8b2a8;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid #2a2422;
  }

  /* ── Buttons ── */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 24px;
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    border: 1.5px solid #ff3a3a;
    background: linear-gradient(180deg, #8b1a1a, #4a0d0d);
    color: #fff;
    border-radius: 3px;
    cursor: pointer;
    box-shadow: 0 0 24px rgba(255,58,58,0.4);
    transition: all 0.24s;
    text-decoration: none;
  }
  .btn:hover {
    background: linear-gradient(180deg, #ff3a3a, #8b1a1a);
    transform: translateY(-1px);
    box-shadow: 0 0 32px rgba(255,58,58,0.7);
  }
  .btn.lg { padding: 16px 40px; font-size: 14px; }
  .btn.sm { padding: 8px 16px; font-size: 10px; }
  .btn.block { width: 100%; }
  .btn.ghost {
    background: transparent;
    border-color: #2a2422;
    color: #b8b2a8;
    box-shadow: none;
  }
  .btn.ghost:hover {
    border-color: #ff3a3a;
    color: #e8e4dc;
  }
  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  /* ── Item grids ── */
  .item-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }
  .item-card {
    position: relative;
    background: linear-gradient(160deg, #1a1616, #0a0a0b);
    border: 1px solid #2a2422;
    border-radius: 5px;
    padding: 16px;
    transition: all 0.24s;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 260px;
  }
  .item-card:hover {
    border-color: #8b1a1a;
    transform: translateY(-3px);
    box-shadow: 0 6px 18px rgba(0,0,0,0.5);
  }
  .item-card.locked { opacity: 0.65; }
  .item-card.equipped {
    border-color: #ff3a3a;
    box-shadow: 0 0 24px rgba(255,58,58,0.25);
  }
  .item-card.equipped::after {
    content: 'EQUIPPED';
    position: absolute;
    top: 8px; right: 8px;
    padding: 3px 8px;
    background: #ff3a3a;
    color: #fff;
    font-family: 'Orbitron', sans-serif;
    font-size: 8px;
    font-weight: 900;
    letter-spacing: 0.14em;
    border-radius: 2px;
    box-shadow: 0 0 12px rgba(255,58,58,0.7);
  }
  .item-icon {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 40%, rgba(139,26,26,0.15), transparent 70%), rgba(5,5,5,0.5);
    border-radius: 3px;
    overflow: hidden;
  }
  .item-icon svg { width: 70%; height: 70%; }
  .item-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    line-height: 1.2;
  }
  .item-desc {
    font-size: 11px;
    color: #6b6b73;
    line-height: 1.5;
    flex: 1;
  }
  .item-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding-top: 12px;
    border-top: 1px solid #2a2422;
  }
  .item-tier {
    font-family: monospace;
    font-size: 10px;
    color: #6b6b73;
    text-transform: uppercase;
  }
  .item-cost {
    font-family: monospace;
    font-size: 12px;
    font-weight: 700;
    color: #ff3a3a;
  }
  .item-cost.owned { color: #4ade80; }
  .item-cost.poor { color: #ff3a3a; opacity: 0.5; }

  /* ── Loadout slots ── */
  .slots {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .slot {
    aspect-ratio: 1;
    background: rgba(5,5,5,0.6);
    border: 1px solid #2a2422;
    border-radius: 3px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.24s;
  }
  .slot:hover {
    border-color: #8b1a1a;
    background: rgba(139,26,26,0.08);
  }
  .slot.empty { border-style: dashed; }
  .slot.empty::after {
    content: '+';
    position: absolute;
    font-family: monospace;
    font-size: 22px;
    color: #2e2929;
  }
  .slot-key {
    position: absolute;
    top: 3px; left: 5px;
    font-family: monospace;
    font-size: 9px;
    color: #6b6b73;
    z-index: 2;
  }
  .slot svg { width: 70%; height: 70%; }
  .slot.active {
    border-color: #ff3a3a;
    box-shadow: 0 0 20px rgba(255,58,58,0.35);
  }

  /* ── Profile / Terminal ── */
  .profile-card {
    background: linear-gradient(160deg, #1a1616, #0a0a0b);
    border: 1px solid #2a2422;
    border-radius: 5px;
    padding: 24px;
    margin-bottom: 16px;
  }
  .profile-identity {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .avatar {
    width: 100px; height: 100px;
    border-radius: 50%;
    background: rgba(5,5,5,0.6);
    border: 2px solid #8b1a1a;
    overflow: hidden;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 30px rgba(255,58,58,0.2);
  }
  .avatar svg { width: 90%; height: 90%; }
  .p-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag {
    padding: 3px 10px;
    border: 1px solid #2a2422;
    border-radius: 999px;
    font-family: monospace;
    font-size: 10px;
    color: #6b6b73;
    text-transform: uppercase;
  }
  .tag.guest { border-color: #fbbf24; color: #fbbf24; }

  .term-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px dashed rgba(139,26,26,0.15);
  }
  .term-row:last-child { border-bottom: none; }
  .term-label {
    font-size: 11px;
    color: #6b6b73;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .term-value {
    font-family: monospace;
    font-size: 13px;
    font-weight: 700;
    color: #e8e4dc;
  }

  .empty {
    padding: 40px 24px;
    text-align: center;
    color: #6b6b73;
    font-family: monospace;
    font-size: 12px;
    text-transform: uppercase;
    border: 1px dashed #2e2929;
    border-radius: 5px;
  }

  /* ── Toast ── */
  .toasts {
    position: fixed;
    bottom: 24px; right: 24px;
    z-index: 500;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  .toast {
    padding: 12px 20px;
    background: linear-gradient(160deg, #242020, #0a0a0b);
    border: 1px solid rgba(139,26,26,0.5);
    border-left: 3px solid #ff3a3a;
    border-radius: 3px;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    animation: toastIn 0.24s ease both;
    max-width: 320px;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(20px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* ── Responsive ── */
  @media (max-width: 720px) {
    .hub { grid-template-columns: 60px 1fr; }
    .main { padding: 20px 16px 48px; }
    .door-hero { padding: 24px; min-height: auto; }
    .brand-name { display: none; }
  }

  /* ── Load Orbitron for the display font ── */
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap');
</style>
</head>
<body>

<div class="hub">

  <!-- ═══════════ SIDEBAR ═══════════ -->
  <aside class="sidebar" id="sidebar"></aside>

  <!-- ═══════════ TOPBAR ═══════════ -->
  <header class="topbar">
    <div class="brand">
      <img src="assets/logo/logo.svg" alt="">
      <span class="brand-name">Predators Horizon</span>
    </div>
    <div class="status">
      <div class="stat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 7 v10 M9 10 h6 M9 14 h6"/>
        </svg>
        <div>
          <div class="stat-label">Credits</div>
          <div class="stat-value" id="creditsEl">₡0</div>
        </div>
      </div>
      <div class="xp">
        <div class="xp-ring">
          <svg viewBox="0 0 36 36">
            <circle class="bg" cx="18" cy="18" r="15.9"></circle>
            <circle class="fg" id="xpRing" cx="18" cy="18" r="15.9"></circle>
          </svg>
          <span class="xp-level" id="levelEl">1</span>
        </div>
        <div class="xp-meta">
          <div class="xp-name" id="nameEl">OPERATOR</div>
          <div class="xp-sub" id="xpSubEl">0 / 120 XP</div>
        </div>
      </div>
    </div>
  </header>

  <!-- ═══════════ MAIN ═══════════ -->
  <main class="main" id="main"></main>

</div>

<div class="toasts" id="toasts"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   SELF-CONTAINED HUB — no external dependencies
   ═══════════════════════════════════════════════════════════════ */

(function () {
  'use strict';

  /* ── Storage keys ── */
  var SAVE_KEY = 'predatorshorizon.save.v1';
  var SESSION_KEY = 'predatorshorizon.session.v1';

  /* ── Utility ── */
  function $(id) { return document.getElementById(id); }
  function qsa(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function el(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {

  function xpForLevel(level) {
    if (level <= 1) return 0;
    var total = 0, cost = 120;
    for (var i = 2; i <= level; i++) { total += cost; cost = Math.round(cost * 1.32); }
    return total;
  }
  function levelInfo(xp) {
    var level = 1;
    while (level < 99 && xp >= xpForLevel(level + 1)) level++;
    var floor = xpForLevel(level);
    var next = xpForLevel(level + 1);
    return { level: level, into: xp - floor, need: next - floor };
  }

  /* ═══════════════════════════════════════════════════════════════
     HUB STATE
     ═══════════════════════════════════════════════════════════════ */
  var state = {
    op: null,
    save: null,
    room: 'door',
    selectedSlot: 0
  };

  var ROOMS = [
    { id: 'door', label: 'Deploy', kicker: 'Mission Control', title: 'The Door',

    { id: 'arsenal', label: 'Arsenal', kicker: 'Weapon Systems', title: 'The Arsenal',

    { id: 'locker', label: 'Locker', kicker: 'Operator Skins', title: 'The Locker',
      icon: '<path d="M12 3 l8 4 v10 l-8 4 l-8-4 V7 z M4 7 l8 4 l8-4 M12 11 v10"/>' },
    { id: 'maps', label: 'Maps', kicker: 'Terrain Selection', title: 'The Map Room',
      icon: '<path d="M3 6 l6-2 l6 2 l6-2 v14 l-6 2 l-6-2 l-6 2 z M9 4 v14 M15 6 v14"/>' },
    { id: 'terminal', label: 'Terminal', kicker: 'Record & Log', title: 'The Terminal',
      icon: '<path d="M4 4 h16 v14 h-6 l-2 3 l-2-3 H4 z M8 9 h8 M8 13 h5"/>' },
    { id: 'mirror', label: 'Mirror', kicker: 'Operator Profile', title: 'The Mirror',
      icon: '<circle cx="12" cy="9" r="4"/><path d="M4 21 v-2 a6 6 0 0 1 6-6 h4 a6 6 0 0 1 6 6 v2"/>' }
  ];

  /* ── Toast ── */
  function toast(msg) {
    var layer = $('toasts');
    var t = el('div', 'toast', esc(msg));
    layer.appendChild(t);
    setTimeout(function () {
      t.style.transition = 'opacity 0.24s, transform 0.24s';
      t.style.opacity = '0';
      t.style.transform = 'translateX(20px)';
      setTimeout(function () { t.remove(); }, 260);
    }, 2400);
  }

  /* ── Persistence helper ── */
  function persist() {
    if (!state.save) return;
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(state.save)); }
    catch (e) { toast('Could not save: ' + e.message); }
  }

  /* ═══════════════════════════════════════════════════════════════
     TOPBAR
     ═══════════════════════════════════════════════════════════════ */
  function refreshTopbar() {
    var op = state.op;
    if (!op) return;
    $('creditsEl').textContent = fmtCoins(op.credits);
    $('nameEl').textContent = op.name;
    var lvl = levelInfo(op.xp);
    $('levelEl').textContent = lvl.level;
    $('xpSubEl').textContent = lvl.into + ' / ' + lvl.need + ' XP';
    var pct = lvl.need ? lvl.into / lvl.need : 0;
    $('xpRing').style.strokeDashoffset = String(100 - pct * 100);
  }

  /* ═══════════════════════════════════════════════════════════════
     SIDEBAR
     ═══════════════════════════════════════════════════════════════ */
  function renderSidebar() {
    var sb = $('sidebar');
    sb.innerHTML = '';
    ROOMS.forEach(function (room) {
      var btn = el('button', 'room-btn' + (room.id === state.room ? ' active' : ''));
      btn.title = room.title;
      btn.innerHTML =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
          room.icon +
        '</svg>' +
        '<span class="room-btn-label">' + room.label + '</span>';
      btn.addEventListener('click', function () { showRoom(room.id); });
      sb.appendChild(btn);
    });

    var footer = el('div', 'sidebar-footer');
    footer.innerHTML =
      '<button class="room-btn" title="Sign Out" id="signOutBtn">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M9 21 H5 a2 2 0 0 1-2-2 V5 a2 2 0 0 1 2-2 h4 M16 17 l5-5-5-5 M21 12 H9"/>' +
        '</svg>' +
        '<span class="room-btn-label">Exit</span>' +
      '</button>';
    footer.querySelector('#signOutBtn').addEventListener('click', function () {
      if (!confirm('Sign out? Your progress is saved.')) return;
      clearSession();
      window.location.href = 'login-single.html';
    });
    sb.appendChild(footer);
  }

  /* ═══════════════════════════════════════════════════════════════
     ROOM NAVIGATION
     ═══════════════════════════════════════════════════════════════ */
  function showRoom(id) {
    var room = ROOMS.filter(function (r) { return r.id === id; })[0];
    if (!room) return;
    state.room = id;
    renderSidebar();

    var main = $('main');
    main.style.opacity = '0';
    setTimeout(function () {
      main.innerHTML = renderRoom(id);
      wireRoom(id);
      main.style.opacity = '1';
      main.style.transition = 'opacity 0.2s';
    }, 60);
  }

  function renderRoom(id) {
    if (id === 'door')     return renderDoor();
    if (id === 'arsenal')  return renderArsenal();
    if (id === 'locker')   return renderLocker();
    if (id === 'maps')     return renderMaps();
    if (id === 'terminal') return renderTerminal();
    if (id === 'mirror')   return renderMirror();
    return '<div class="empty">Unknown room</div>';
  }

  /* ═══════════════════════════════════════════════════════════════
     ROOM: DOOR
     ═══════════════════════════════════════════════════════════════ */
  function renderDoor() {
    var op = state.op;
    var loadout = op.loadout;
    var skin = SKINS[loadout.skin] || SKINS[0];
    var slotsHtml = '';
    for (var i = 0; i < 8; i++) {
      var wid = loadout.weapons[i];
      var w = wid != null ? WEAPONS[wid] : null;
      slotsHtml +=
        '<div class="slot' + (w ? '' : ' empty') + '" data-slot="' + i + '" title="' + (w ? esc(w.name) : 'Empty') + '">' +
          '<span class="slot-key">' + (i + 1) + '</span>' +
          (w ? weaponSvg(w) : '') +
        '</div>';
    }

    return '' +
      '<section class="room active">' +
        '<div class="door">' +
          '<div class="door-hero">' +
            '<div>' +
              '<div class="door-badge">Mission Ready</div>' +
              '<h2 class="door-title">Predator <span>01</span></h2>' +
              '<p class="door-lead">' +
                'The first breach. Learn the safehouse, learn the rhythm, ' +
                'and get out alive. Everything after this is worse.' +
              '</p>' +
            '</div>' +
            '<div class="door-cta">' +
              '<button class="btn lg" id="playBtn">Deploy</button>' +
              '<button class="btn lg ghost" id="endlessBtn">Endless Loop</button>' +
            '</div>' +
          '</div>' +
          '<div class="panel">' +
            '<div class="panel-title">Current Loadout</div>' +
            '<div class="slots" style="margin-bottom:20px">' + slotsHtml + '</div>' +
            '<div class="panel-title">Operator</div>' +
            '<div style="display:flex;gap:16px;align-items:center">' +
              '<div class="avatar" style="width:64px;height:64px;border-color:' + skin.accent + '">' + skinSvg(skin) + '</div>' +
              '<div>' +
                '<div style="font-family:Orbitron,sans-serif;font-size:13px;letter-spacing:0.16em;text-transform:uppercase">' + esc(op.name) + '</div>' +
                '<div style="font-family:monospace;font-size:11px;color:#6b6b73;margin-top:2px">' + skin.name + '</div>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</section>';
  }

  function wireRoom(id) {
    if (id === 'door') wireDoor();
    else if (id === 'arsenal') wireArsenal();
    else if (id === 'locker') wireLocker();
    else if (id === 'maps') wireMaps();
    else if (id === 'terminal') wireTerminal();
    else if (id === 'mirror') wireMirror();
  }

  function wireDoor() {
    var play = $('playBtn');
    if (play) play.addEventListener('click', function () {
      if (!state.op.loadout.weapons.length) {
        toast('Equip a weapon first');
        showRoom('arsenal');
        return;
      }
      toast('Deploying…');
      setTimeout(function () { window.location.href = 'play-single.html'; }, 500);
    });
    var endless = $('endlessBtn');
    if (endless) endless.addEventListener('click', function () {
      state.op.settings.mode = 'endless';
      persist();
      toast('Entering Endless Loop…');
      setTimeout(function () { window.location.href = 'play-single.html'; }, 500);
    });
    qsa('.slot').forEach(function (s) {
      s.addEventListener('click', function () {
        state.selectedSlot = parseInt(s.dataset.slot, 10) || 0;
        showRoom('arsenal');
      });
    });
  }

  /* ═══════════════════════════════════════════════════════════════
     ROOM: ARSENAL
     ═══════════════════════════════════════════════════════════════ */
  function renderArsenal() {
    var op = state.op;
    var selectedSlot = state.selectedSlot;
    var chips = '<div style="display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap">';
    for (var i = 0; i < 8; i++) {
      var wid = op.loadout.weapons[i];
      var w = wid != null ? WEAPONS[wid] : null;
      var active = i === selectedSlot;
      chips += '<button class="btn sm ' + (active ? '' : 'ghost') + '" data-slot-pick="' + i + '" style="min-width:44px;padding:6px 10px;font-size:11px">' +
        (i + 1) + (w ? ' · ' + w.glyph : '') + '</button>';
    }
    chips += '</div>';

    var cards = WEAPONS.map(function (w) {
      var owned = op.unlockedWeapons.indexOf(w.id) >= 0;
      var equipped = op.loadout.weapons.indexOf(w.id) >= 0;
      var canAfford = op.credits >= w.cost;
      var cls = 'item-card' + (owned ? '' : ' locked') + (equipped ? ' equipped' : '');
      var costCls = w.cost === 0 || owned ? 'owned' : (canAfford ? '' : 'poor');
      var costText = w.cost === 0 ? 'FREE' : (owned ? 'OWNED' : fmtCoins(w.cost));
      var action = '';
      if (!owned) {
        action = '<button class="btn sm block" data-action="unlock" data-wid="' + w.id + '"' + (canAfford ? '' : ' disabled') + '>Unlock</button>';
      } else if (equipped) {
        action = '<button class="btn sm block ghost" data-action="unequip" data-wid="' + w.id + '">Unequip</button>';
      } else {
        action = '<button class="btn sm block" data-action="equip" data-wid="' + w.id + '">Equip to Slot ' + (selectedSlot + 1) + '</button>';
      }
      return '<div class="' + cls + '">' +
        '<div class="item-icon">' + weaponSvg(w) + '</div>' +
        '<div class="item-name">' + esc(w.name) + '</div>' +
        '<div class="item-desc">' + esc(w.desc) + '</div>' +
        '<div class="item-meta">' +
          '<span class="item-tier">Tier ' + w.tier + ' · ' + w.dps + ' DPS</span>' +
          '<span class="item-cost ' + costCls + '">' + costText + '</span>' +
        '</div>' +
        action +
      '</div>';
    }).join('');

    return '' +
      '<section class="room active">' +
        '<div class="room-head">' +
          '<div>' +
            '<div class="room-kicker">Weapon Systems</div>' +
            '<h2 class="room-title">The Arsenal</h2>' +
            '<p class="room-sub">Twelve weapons. Pick a slot, then a weapon.</p>' +
          '</div>' +
        '</div>' +
        '<div style="font-family:Orbitron,sans-serif;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#6b6b73;margin-bottom:12px">Assign to slot</div>' +
        chips +
        '<div class="item-grid">' + cards + '</div>' +
      '</section>';
  }

  function wireArsenal() {
    qsa('[data-slot-pick]').forEach(function (chip) {
      chip.addEventListener('click', function () {
        state.selectedSlot = parseInt(chip.dataset.slotPick, 10);
        showRoom('arsenal');
      });
    });
    qsa('[data-action="unlock"]').forEach(function (b) {
      b.addEventListener('click', function () {
        var wid = parseInt(b.dataset.wid, 10);
        var w = WEAPONS[wid];
        if (state.op.credits < w.cost) { toast('Not enough credits'); return; }
        state.op.credits -= w.cost;
        state.op.unlockedWeapons.push(wid);
        persist();
        toast(w.name + ' unlocked');
        refreshTopbar();
        showRoom('arsenal');
      });
    });
    qsa('[data-action="equip"]').forEach(function (b) {
      b.addEventListener('click', function () {
        var wid = parseInt(b.dataset.wid, 10);
        var w = WEAPONS[wid];
        var i = state.op.loadout.weapons.indexOf(wid);
        if (i >= 0) state.op.loadout.weapons.splice(i, 1);
        state.op.loadout.weapons[state.selectedSlot] = wid;
        while (state.op.loadout.weapons.length && state.op.loadout.weapons[state.op.loadout.weapons.length - 1] == null) {
          state.op.loadout.weapons.pop();
        }
        persist();
        toast(w.name + ' equipped');
        showRoom('arsenal');
      });
    });
    qsa('[data-action="unequip"]').forEach(function (b) {
      b.addEventListener('click', function () {
        var wid = parseInt(b.dataset.wid, 10);
        var i = state.op.loadout.weapons.indexOf(wid);
        if (i >= 0) state.op.loadout.weapons.splice(i, 1);
        persist();
        toast('Unequipped');
        showRoom('arsenal');
      });
    });
  }

     ROOM: LOCKER

      } else if (equipped) {

        '<div class="item-name">' + esc(s.name) + '</div>' +
        '<div class="item-desc">' + esc(s.desc) + '</div>' +
        '<div class="item-meta">' +

  function wireLocker() {

        showRoom('locker');

  /* ═══════════════════════════════════════════════════════════════
     ROOM: TERMINAL
     ═══════════════════════════════════════════════════════════════ */
  function renderTerminal() {
    var op = state.op;
    var s = op.stats;
    var lvl = levelInfo(op.xp);

    var rows = [
      ['Operator Level', lvl.level + ' (' + lvl.into + ' / ' + lvl.need + ' XP)'],
      ['Lifetime Runs', s.runs],
      ['Lifetime Kills', s.totalKills],
      ['Lifetime Score', s.totalScore],
      ['Best Score', s.bestScore],
      ['Best Wave', s.bestWave],
      ['Time Played', fmtTime(s.totalTime)],
      ['Deaths', s.deaths],
      ['Wins', s.wins]
    ].map(function (r) {
      return '<div class="term-row"><span class="term-label">' + r[0] + '</span><span class="term-value">' + r[1] + '</span></div>';
    }).join('');

    var history = op.history && op.history.length
      ? op.history.slice(0, 10).map(function (h) {
          return '<div class="term-row">' +
            '<span class="term-label">' + (h.mode || 'RUN') + (h.level ? ' · L' + h.level : '') + ' · ' + new Date(h.date).toLocaleDateString() + '</span>' +
            '<span class="term-value">' + (h.score || 0) + ' pts · ' + (h.kills || 0) + ' kills</span>' +
          '</div>';
        }).join('')
      : '<div class="empty">No runs recorded yet</div>';

    return '' +
      '<section class="room active">' +
        '<div class="room-head">' +
          '<div>' +
            '<div class="room-kicker">Record & Log</div>' +
            '<h2 class="room-title">The Terminal</h2>' +
            '<p class="room-sub">Everything the operator has done.</p>' +
          '</div>' +
        '</div>' +
        '<div class="panel" style="margin-bottom:16px">' +
          '<div class="panel-title">Statistics</div>' +
          rows +
        '</div>' +
        '<div class="panel">' +
          '<div class="panel-title">Recent Runs</div>' +
          history +
        '</div>' +
      '</section>';
  }

  function wireTerminal() {}

                '<span class="tag">' + fmtCoins(op.credits) + '</span>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="panel" style="margin-top:16px">' +
          '<div class="panel-title">Danger Zone</div>' +
          '<button class="btn ghost" id="deleteBtn" style="border-color:#ff3a3a;color:#ff3a3a">Delete Operator</button>' +
        '</div>' +
      '</section>';
  }

  function wireMirror() {
    var b = $('deleteBtn');
    if (b) b.addEventListener('click', function () {
      if (!confirm('Permanently delete ' + state.op.name + '? All progress will be lost.')) return;
      delete state.save.operators[state.op.name];
      if (state.save.lastOperator === state.op.name) state.save.lastOperator = null;
      persist();
      clearSession();
      window.location.href = 'login-single.html';
    });
  }

  /* ═══════════════════════════════════════════════════════════════
     BOOT
     ═══════════════════════════════════════════════════════════════ */
  function boot() {
    /* Check session */
    var session = loadSession();
    if (!session || !session.name) {
      console.warn('No session — redirecting to login');
      window.location.href = 'login-single.html';
      return;
    }

    var save = loadSave();
    var op = save.operators[session.name];
    if (!op) {
      console.warn('Session operator missing from save — redirecting to login');
      clearSession();
      window.location.href = 'login-single.html';
      return;
    }

    /* Fill in any missing fields (defensive for older saves) */
    if (!op.unlockedWeapons) op.unlockedWeapons = [0];
    if (!op.unlockedSkins) op.unlockedSkins = [0];
    if (!op.unlockedTerrains) op.unlockedTerrains = [0];
    if (!op.loadout) op.loadout = { weapons: [0], skin: 0, terrain: 0 };
    if (!op.loadout.weapons) op.loadout.weapons = [0];
    if (op.loadout.skin == null) op.loadout.skin = 0;
    if (op.loadout.terrain == null) op.loadout.terrain = 0;
    if (!op.stats) op.stats = { runs: 0, kills: 0, deaths: 0, wins: 0, bestScore: 0, bestWave: 0, bestTime: 0, totalTime: 0, totalScore: 0, totalKills: 0, bossesKilled: 0, shotsFired: 0, damageDealt: 0, dashes: 0, pickups: 0, levelsCleared: 0 };
    if (!op.endless) op.endless = { bestWave: 0, bestScore: 0, bestLevel: 1, runs: 0 };
    if (!op.history) op.history = [];
    if (!op.awards) op.awards = [];
    if (!op.settings) op.settings = { sfx: true, music: false, shake: 1, difficulty: 0, mode: 'large', theme: 'city' };

    state.save = save;
    state.op = op;
    op.lastSeen = Date.now();
    persist();

    /* Render */
    renderSidebar();
    refreshTopbar();
    showRoom('door');

    console.log('Hub booted for operator:', op.name);
  }

  boot();

})();
</script>
</body>
</html>
