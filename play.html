<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Predator 01 — Predators Horizon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blood: #8b1a1a;
    --blood-hot: #ff3a3a;
    --blood-glow: #ff5a5a;
    --void: #050505;
    --iron: #1a1616;
    --iron-2: #242020;
    --iron-3: #2e2929;
    --bone: #e8e4dc;
    --bone-dim: #b8b2a8;
    --ash: #6b6b73;
    --ok: #4ade80;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: var(--void);
    color: var(--bone);
    font-family: 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
    font-weight: 600;
    overflow: hidden;
    cursor: crosshair;
  }
  canvas { display: block; position: absolute; inset: 0; }
  button { font-family: inherit; font-weight: 700; cursor: pointer; border: none; background: none; color: inherit; }

  /* ═══════════════ HUD ═══════════════ */
  .hud {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    font-variant-numeric: tabular-nums;
  }
  .hud > * { pointer-events: auto; }

  /* Top strip: back button + mission label */
  .top-strip {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 16px 24px;
    pointer-events: none;
  }
  .top-strip > * { pointer-events: auto; }
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: rgba(5,5,5,0.75);
    border: 1px solid var(--iron-3);
    border-radius: 3px;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--bone-dim);
    backdrop-filter: blur(10px);
    transition: all 0.24s;
    text-decoration: none;
  }
  .back-btn:hover {
    border-color: var(--blood-hot);
    color: var(--bone);
    box-shadow: 0 0 20px rgba(255,58,58,0.3);
  }
  .back-btn svg { width: 14px; height: 14px; }

  .mission-label {
    text-align: center;
    padding: 10px 18px;
    background: rgba(5,5,5,0.75);
    border: 1px solid rgba(139,26,26,0.55);
    border-radius: 3px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 24px rgba(139,26,26,0.25);
  }
  .mission-kicker {
    font-family: 'Orbitron', sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--blood-hot);
    text-shadow: 0 0 12px rgba(255,58,58,0.6);
  }
  .mission-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--bone);
    margin-top: 2px;
  }
  .mission-wave {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ash);
    letter-spacing: 0.08em;
    margin-top: 2px;
  }

  /* Score panel */
  .score-panel {
    position: absolute;
    top: 96px;
    right: 24px;
    text-align: right;
  }
  .score-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 40px;
    font-weight: 900;
    letter-spacing: 0.02em;
    background: linear-gradient(180deg, var(--bone), var(--blood));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 20px rgba(255,58,58,0.4));
    line-height: 1;
  }
  .score-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.16em;
    color: var(--ash);
    text-transform: uppercase;
    margin-top: 2px;
  }
  .timer {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--bone-dim);
    margin-top: 6px;
  }

  /* Combo popup */
  .combo {
    position: absolute;
    top: 200px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Orbitron', sans-serif;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 0.16em;
    color: #ffd76b;
    text-shadow: 0 0 22px rgba(255,215,107,0.7);
    opacity: 0;
    transition: opacity 0.15s;
    pointer-events: none;
  }

  /* Vitals panel bottom-left */
  .vitals {
    position: absolute;
    bottom: 24px;
    left: 24px;
    width: 300px;
  }
  .bar {
    margin-bottom: 12px;
  }
  .bar-label {
    display: flex;
    justify-content: space-between;
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ash);
    margin-bottom: 4px;
  }
  .bar-outer {
    height: 16px;
    background: rgba(5,5,5,0.8);
    border: 1px solid var(--iron-3);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
    transform: skewX(-12deg);
  }
  .bar-outer::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.18), transparent 55%);
    pointer-events: none;
  }
  .bar-inner {
    height: 100%;
    transition: width 0.15s ease;
    border-radius: 2px;
  }
  .bar-inner.hp {
    background: linear-gradient(90deg, #d11a35, #ff5a5a);
    box-shadow: 0 0 18px rgba(255,58,58,0.55);
  }
  .bar-inner.hp.low { animation: blink 0.5s infinite; }
  @keyframes blink { 50% { opacity: 0.45; } }
  .bar-inner.focus {
    background: linear-gradient(90deg, #8b1a1a, #ff8a5b);
    box-shadow: 0 0 18px rgba(255,138,91,0.4);
  }

  /* Weapon panel bottom-center */
  .weapon-panel {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
  }
  .weapon-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--bone);
    text-shadow: 0 0 20px rgba(255,58,58,0.4);
  }
  .weapon-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--blood-hot);
    margin-top: 4px;
  }
  .weapon-slots {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-top: 10px;
  }
  .wslot {
    width: 40px; height: 40px;
    background: rgba(5,5,5,0.75);
    border: 1px solid var(--iron-3);
    border-radius: 3px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: all 0.15s;
    cursor: pointer;
    backdrop-filter: blur(10px);
  }
  .wslot:hover { border-color: var(--blood); }
  .wslot.active {
    border-color: var(--blood-hot);
    box-shadow: 0 0 16px rgba(255,58,58,0.5);
    transform: translateY(-3px);
  }
  .wslot-key {
    position: absolute;
    top: 2px; left: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    color: var(--ash);
  }
  .wslot-glyph {
    font-size: 16px;
    color: var(--bone);
  }

  /* Minimap bottom-right */
  .minimap-wrap {
    position: absolute;
    bottom: 24px;
    right: 24px;
    width: 160px;
    height: 160px;
    background: rgba(5,5,5,0.75);
    border: 1px solid var(--iron-3);
    border-radius: 3px;
    overflow: hidden;
    backdrop-filter: blur(10px);
  }
  .minimap-wrap canvas { display: block; width: 100%; height: 100%; }
  .minimap-label {
    position: absolute;
    bottom: 4px; left: 0; right: 0;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.16em;
    color: var(--ash);
    text-transform: uppercase;
    pointer-events: none;
    text-shadow: 0 0 10px #050505;
  }

  /* Damage vignette */
  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    opacity: 0;
    background: radial-gradient(circle, transparent 35%, rgba(255,45,90,0) 55%, rgba(255,45,90,0.55) 100%);
    transition: opacity 0.1s;
  }
  .flash {
    position: absolute;
    inset: 0;
    background: #ff4d7a;
    opacity: 0;
    pointer-events: none;
    mix-blend-mode: screen;
    z-index: 6;
  }

  /* Game over overlay */
  .overlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(14,7,40,0.55), rgba(3,1,13,0.92) 90%);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 16px;
    z-index: 100;
    backdrop-filter: blur(10px);
    padding: 24px;
  }
  .overlay.active { display: flex; }
  .overlay-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 40px;
    font-weight: 900;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    background: linear-gradient(180deg, var(--bone), var(--blood));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 40px rgba(255,58,58,0.35));
  }
  .overlay-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.16em;
    color: var(--blood-hot);
    text-transform: uppercase;
  }
  .stat-row {
    display: flex;
    gap: 40px;
    flex-wrap: wrap;
    justify-content: center;
    margin: 16px 0;
  }
  .stat {
    text-align: center;
  }
  .stat-v {
    font-family: 'Orbitron', sans-serif;
    font-size: 32px;
    font-weight: 900;
    background: linear-gradient(180deg, var(--bone), var(--blood));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 20px rgba(255,58,58,0.3));
  }
  .stat-l {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.16em;
    color: var(--ash);
    text-transform: uppercase;
    margin-top: 4px;
  }
  .reward-line {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: #ffd76b;
    text-shadow: 0 0 14px rgba(255,215,107,0.5);
    letter-spacing: 0.08em;
  }

  /* Pause overlay */
  .pause-overlay {
    position: absolute;
    inset: 0;
    background: rgba(3,1,13,0.85);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 16px;
    z-index: 90;
    backdrop-filter: blur(8px);
  }
  .pause-overlay.active { display: flex; }

  /* Generic button */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 32px;
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    border: 1.5px solid var(--blood-hot);
    background: linear-gradient(180deg, var(--blood), #4a0d0d);
    color: #fff;
    border-radius: 3px;
    box-shadow: 0 0 24px rgba(255,58,58,0.4);
    transition: all 0.24s;
    text-decoration: none;
  }
  .btn:hover {
    background: linear-gradient(180deg, var(--blood-hot), var(--blood));
    transform: translateY(-1px);
    box-shadow: 0 0 32px rgba(255,58,58,0.7);
  }
  .btn.ghost {
    background: transparent;
    border-color: var(--iron-3);
    color: var(--bone-dim);
    box-shadow: none;
  }
  .btn.ghost:hover {
    border-color: var(--blood-hot);
    color: var(--bone);
  }

  /* Crosshair follows mouse — subtle dot */
  .cursor-dot {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: rgba(255,58,58,0.9);
    box-shadow: 0 0 12px rgba(255,58,58,0.9);
    pointer-events: none;
    z-index: 20;
    transform: translate(-50%, -50%);
    transition: transform 0.05s linear;
  }

  @media (max-width: 720px) {
    .vitals { width: 200px; bottom: 16px; left: 16px; }
    .minimap-wrap { width: 110px; height: 110px; bottom: 16px; right: 16px; }
    .weapon-panel { bottom: 16px; }
    .score-panel { top: 80px; right: 16px; }
    .score-value { font-size: 28px; }
    .wslot { width: 32px; height: 32px; }
    .wslot-glyph { font-size: 12px; }
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<!-- Damage vignette + flash -->
<div class="vignette" id="vignette"></div>
<div class="flash" id="flash"></div>

<!-- Crosshair dot -->
<div class="cursor-dot" id="cursorDot" style="left: -10px; top: -10px;"></div>

<!-- ═══════════════ HUD ═══════════════ -->
<div class="hud">

  <div class="top-strip">
    <a class="back-btn" href="app.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12 H5 M12 19 l-7-7 7-7"/>
      </svg>
      Safehouse
    </a>
    <div class="mission-label">
      <div class="mission-kicker">Mission</div>
      <div class="mission-name" id="missionName">Predator 01</div>
      <div class="mission-wave" id="waveText">Wave 1</div>
    </div>
    <div style="width:120px"></div>
  </div>

  <div class="score-panel">
    <div class="score-value" id="scoreText">0</div>
    <div class="score-label">Score</div>
    <div class="timer" id="timerText">00:00</div>
  </div>

  <div class="combo" id="comboText"></div>

  <div class="vitals">
    <div class="bar">
      <div class="bar-label"><span>Health</span><span id="hpText">260/260</span></div>
      <div class="bar-outer"><div class="bar-inner hp" id="hpBar" style="width:100%"></div></div>
    </div>
    <div class="bar">
      <div class="bar-label"><span>Focus</span><span id="focusText">0/100</span></div>
      <div class="bar-outer"><div class="bar-inner focus" id="focusBar" style="width:0%"></div></div>
    </div>
  </div>

  <div class="weapon-panel">
    <div class="weapon-name" id="weaponName">Kinetic Rifle</div>
    <div class="weapon-sub" id="weaponSub">Focus · Free</div>
    <div class="weapon-slots" id="weaponSlots"></div>
  </div>

  <div class="minimap-wrap">
    <canvas id="minimap" width="320" height="320"></canvas>
    <div class="minimap-label">Sector Scan</div>
  </div>

</div>

<!-- ═══════════════ PAUSE ═══════════════ -->
<div class="pause-overlay" id="pauseOverlay">
  <div class="overlay-sub">Systems Idle</div>
  <div class="overlay-title" style="font-size:32px">Paused</div>
  <div style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#6b6b73;letter-spacing:0.06em">Press ESC or Space to resume</div>
  <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px">
    <button class="btn" id="resumeBtn">Resume</button>
    <button class="btn ghost" id="abortBtn">Abort Run</button>
  </div>
</div>

<!-- ═══════════════ GAME OVER ═══════════════ -->
<div class="overlay" id="deathOverlay">
  <div class="overlay-sub">Signal Lost</div>
  <div class="overlay-title">You Were Pulled In</div>
  <div class="stat-row">
    <div class="stat"><div class="stat-v" id="finalScore">0</div><div class="stat-l">Score</div></div>
    <div class="stat"><div class="stat-v" id="finalWave">1</div><div class="stat-l">Wave</div></div>
    <div class="stat"><div class="stat-v" id="finalKills">0</div><div class="stat-l">Kills</div></div>
    <div class="stat"><div class="stat-v" id="finalTime">00:00</div><div class="stat-l">Survived</div></div>
  </div>
  <div class="reward-line" id="rewardLine"></div>
  <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px">
    <button class="btn" id="retryBtn">Retry</button>
    <a class="btn ghost" href="app.html">Return to Hub</a>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   PREDATORS HORIZON — play.html
   Playable vertical slice. Single-file, no external dependencies.
   ═══════════════════════════════════════════════════════════════ */

(function () {
  'use strict';

  var SAVE_KEY = 'predatorshorizon.save.v1';
  var SESSION_KEY = 'predatorshorizon.session.v1';

  /* ── Helpers ── */
  function $(id) { return document.getElementById(id); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function dist2(x1, y1, x2, y2) { return (x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1); }
  function fmtTime(s) {
    s = Math.max(0, Math.floor(s));
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }

  /* ── Storage ── */
  function loadSave() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) { return null; }
  }
  function writeSave(s) {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(s)); return true; }
    catch (e) { return false; }
  }
  function loadSession() {
    try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); }
    catch (e) { return null; }
  }
  function clearSession() {
    try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
  }

  /* ── Data tables (mirror of app.html) ── */
  var WEAPONS = [
    { id: 0, name: 'Kinetic Rifle', glyph: '◆', accent: '#ff3a3a', dps: 180, cd: 0.10, dmg: 18, speed: 900, r: 3, life: 1.2, type: 'bullet', cost: 0 },
    { id: 1, name: 'Pulse SMG', glyph: '▦', accent: '#ff5a5a', dps: 163, cd: 0.055, dmg: 9, speed: 1050, r: 2.5, life: 1.0, type: 'bullet', cost: 0 },
    { id: 2, name: 'Scatter Shot', glyph: '✣', accent: '#ff8a3a', dps: 155, cd: 0.42, dmg: 13, speed: 720, r: 3, life: 0.95, type: 'spread', pellets: 5, spread: 0.09, cost: 8 },
    { id: 3, name: 'Rail Sniper', glyph: '╋', accent: '#ffe27a', dps: 124, cd: 0.85, dmg: 105, speed: 1500, r: 5, life: 1.5, type: 'rail', cost: 28 },
    { id: 4, name: 'Plasma Burst', glyph: '✦', accent: '#ff78f0', dps: 117, cd: 0.24, dmg: 28, speed: 680, r: 7, life: 1.4, type: 'plasma', cost: 16 },
    { id: 5, name: 'Singularity Cannon', glyph: '●', accent: '#b791ff', dps: 87, cd: 0.60, dmg: 52, speed: 500, r: 10, life: 1.6, type: 'cannon', aoe: 70, cost: 25 },
    { id: 6, name: 'Rocket Launcher', glyph: '▲', accent: '#ff8a5b', dps: 63, cd: 1.15, dmg: 72, speed: 420, r: 9, life: 2.2, type: 'rocket', aoe: 90, cost: 35 },
    { id: 7, name: 'Gravity Well', glyph: '◎', accent: '#9c7cff', dps: 26, cd: 1.0, dmg: 26, speed: 0, r: 0, life: 0, type: 'well', cost: 45 },
    { id: 8, name: 'Arc Beam', glyph: '≡', accent: '#8ee4ff', dps: 189, cd: 0.18, dmg: 34, speed: 0, r: 0, life: 0, type: 'beam', cost: 12 },
    { id: 9, name: 'Chain Lightning', glyph: '⚡', accent: '#ffe27a', dps: 63, cd: 0.38, dmg: 24, speed: 900, r: 4, life: 1.0, type: 'chain', cost: 22 },
    { id: 10, name: 'Proximity Mines', glyph: '◈', accent: '#ff5fa7', dps: 164, cd: 0.55, dmg: 90, speed: 0, r: 12, life: 12, type: 'mine', aoe: 110, cost: 18 },
    { id: 11, name: 'Flak Burster', glyph: '✺', accent: '#ffa06b', dps: 57, cd: 0.70, dmg: 40, speed: 600, r: 8, life: 1.0, type: 'flak', burstAt: 0.55, burstCount: 10, burstDmg: 12, cost: 30 }
  ];

  var SKINS = [
    { id: 0, shape: 'diamond', body: '#dfe7ff', accent: '#8ee4ff' },
    { id: 1, shape: 'circle', body: '#1a1420', accent: '#b791ff' },
    { id: 2, shape: 'hex', body: '#17291f', accent: '#7dffcf' },
    { id: 3, shape: 'square', body: '#3b1822', accent: '#ff4d7a' },
    { id: 4, shape: 'circle', body: '#30210b', accent: '#ffd76b' },
    { id: 5, shape: 'diamond', body: '#24152f', accent: '#ff78f0' },
    { id: 6, shape: 'square', body: '#1a202b', accent: '#ffffff' },
    { id: 7, shape: 'hex', body: '#35170d', accent: '#ff8a5b' },
    { id: 8, shape: 'circle', body: '#0b2430', accent: '#8ee4ff' },
    { id: 9, shape: 'hex', body: '#132b16', accent: '#9dff5b' },
    { id: 10, shape: 'diamond', body: '#3a2a00', accent: '#ffea00' },
    { id: 11, shape: 'circle', body: '#060614', accent: '#6a5aff' },
    { id: 12, shape: 'square', body: '#c8ced8', accent: '#ff5a5a' },
    { id: 13, shape: 'hex', body: '#2b0510', accent: '#ff2d6a' },
    { id: 14, shape: 'diamond', body: '#1a0b38', accent: '#c86fff' },
    { id: 15, shape: 'circle', body: '#05050f', accent: '#ff5fa7' }
  ];

  /* ═══════════════ GAME STATE ═══════════════ */
  var canvas = $('game');
  var ctx = canvas.getContext('2d');
  var mmCanvas = $('minimap');
  var mmCtx = mmCanvas.getContext('2d');
  var W = 0, H = 0;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  /* World is a bounded arena (not the huge torus yet) */
  var WORLD_W = 3000;
  var WORLD_H = 2000;

  var state = {
    running: false,
    paused: false,
    dead: false,
    elapsed: 0,
    score: 0,
    kills: 0,
    wave: 1,
    enemiesToSpawn: 0,
    spawnTimer: 0,
    spawnInterval: 1.4,
    combo: 0,
    comboTimer: 0,
    screenShake: 0,
    timeAccum: 0
  };

  var player = null;
  var weapons = [];
  var weaponIndex = 0;
  var fireTimer = 0;

  var bullets = [];
  var enemyBullets = [];
  var enemies = [];
  var particles = [];
  var floatTexts = [];
  var shockwaves = [];
  var wells = [];
  var mines = [];
  var beams = [];

  var camera = { x: 0, y: 0 };
  var keys = {};
  var mouse = { x: 0, y: 0, down: false };

  /* ── Load operator from save ── */
  var save = loadSave();
  var session = loadSession();
  var op = save && session && save.operators[session.name];

  if (!op) {
    document.body.innerHTML = '<div style="display:grid;place-items:center;min-height:100vh;color:#e8e4dc;font-family:sans-serif;text-align:center"><div><h1>Session expired</h1><p>Returning to safehouse…</p></div></div>';
    clearSession();
    setTimeout(function () { window.location.href = 'app.html'; }, 800);
    return;
  }

  /* ── Equipped weapons from loadout ── */
  var loadoutIds = op.loadout.weapons && op.loadout.weapons.length ? op.loadout.weapons.slice() : [0];
  weapons = loadoutIds.map(function (id) { return WEAPONS[id]; }).filter(Boolean);
  if (!weapons.length) weapons = [WEAPONS[0]];

  var skin = SKINS[op.loadout.skin] || SKINS[0];

  /* ═══════════════ PLAYER ═══════════════ */
  function makePlayer() {
    return {
      x: WORLD_W / 2,
      y: WORLD_H / 2,
      r: 16,
      hp: 260,
      maxHp: 260,
      focus: 0,
      maxFocus: 100,
      speed: 300,
      moveAngle: null,
      invuln: 0,
      dashCd: 0,
      dashTime: 0,
      dashVX: 0,
      dashVY: 0,
      hitFlash: 0
    };
  }

  /* ═══════════════ ENEMY SPAWNING ═══════════════ */
  function spawnEnemy() {
    var minD = Math.max(W, H) * 0.55;
    var x, y, tries = 0;
    do {
      var a = rand(0, Math.PI * 2);
      var d = rand(minD, Math.max(W, H) * 1.1);
      x = clamp(player.x + Math.cos(a) * d, 30, WORLD_W - 30);
      y = clamp(player.y + Math.sin(a) * d, 30, WORLD_H - 30);
      tries++;
    } while (dist2(x, y, player.x, player.y) < 400 * 400 && tries < 30);

    var roll = Math.random();
    var type = 'drone';
    if (state.wave >= 3 && roll > 0.90) type = 'brute';
    else if (state.wave >= 2 && roll > 0.70) type = 'shooter';
    else if (state.wave >= 2 && roll > 0.55) type = 'sprinter';

    var scale = 1 + state.wave * 0.08;
    var e;
    if (type === 'brute') {
      e = { x: x, y: y, r: 26, hp: 120 * scale, maxHp: 120 * scale, speed: 60 + state.wave * 1.4, dmg: 20, color: '#ff8fa3', type: 'brute', xpVal: 4 };
    } else if (type === 'shooter') {
      e = { x: x, y: y, r: 15, hp: 40 * scale, maxHp: 40 * scale, speed: 78 + state.wave * 1.5, dmg: 12, color: '#ff9d4d', type: 'shooter', shootCd: rand(0.6, 1.4), xpVal: 3 };
    } else if (type === 'sprinter') {
      e = { x: x, y: y, r: 12, hp: 26 * scale, maxHp: 26 * scale, speed: 175 + state.wave * 3, dmg: 8, color: '#ffd76b', type: 'sprinter', xpVal: 2 };
    } else {
      e = { x: x, y: y, r: 15, hp: 34 * scale, maxHp: 34 * scale, speed: 98 + state.wave * 2, dmg: 10, color: '#6feaff', type: 'drone', xpVal: 1 };
    }
    e.hitFlash = 0;
    enemies.push(e);
  }

  /* ═══════════════ MOVEMENT + COLLISION ═══════════════ */
  function movePlayer(dx, dy) {
    player.x = clamp(player.x + dx, player.r, WORLD_W - player.r);
    player.y = clamp(player.y + dy, player.r, WORLD_H - player.r);
  }

  /* ═══════════════ FIRING ═══════════════ */
  function fireWeapon(w) {
    var target = { x: mouse.x + camera.x, y: mouse.y + camera.y };
    var baseA = Math.atan2(target.y - player.y, target.x - player.x);

    if (w.type === 'spread') {
      for (var i = 0; i < w.pellets; i++) {
        var off = (i - (w.pellets - 1) / 2) * w.spread;
        pushBullet(player, baseA + off, w);
      }
    } else if (w.type === 'rail') {
      pushBullet(player, baseA, w, { pierce: 99 });
    } else if (w.type === 'well') {
      var dist = 240;
      wells.push({
        x: clamp(player.x + Math.cos(baseA) * dist, 50, WORLD_W - 50),
        y: clamp(player.y + Math.sin(baseA) * dist, 50, WORLD_H - 50),
        r: 16, maxR: 155, life: 3.5, age: 0, pullForce: 420, dps: w.dmg
      });
    } else if (w.type === 'beam') {
      var range = 900;
      var ex = player.x + Math.cos(baseA) * range;
      var ey = player.y + Math.sin(baseA) * range;
      beams.push({ x1: player.x, y1: player.y, x2: ex, y2: ey, life: 0.12, color: w.accent });
      for (var j = enemies.length - 1; j >= 0; j--) {
        var e = enemies[j];
        var dx = e.x - player.x, dy = e.y - player.y;
        var proj = dx * Math.cos(baseA) + dy * Math.sin(baseA);
        if (proj < 0 || proj > range) continue;
        var px = player.x + Math.cos(baseA) * proj;
        var py = player.y + Math.sin(baseA) * proj;
        if (dist2(px, py, e.x, e.y) < (e.r + 14) * (e.r + 14)) damageEnemy(e, j, w.dmg);
      }
    } else if (w.type === 'mine') {
      mines.push({
        x: clamp(player.x + Math.cos(baseA) * 40, 20, WORLD_W - 20),
        y: clamp(player.y + Math.sin(baseA) * 40, 20, WORLD_H - 20),
        r: 12, life: w.life, dmg: w.dmg, aoe: w.aoe, color: w.accent
      });
    } else if (w.type === 'flak') {
      pushBullet(player, baseA, w, { burstAt: w.burstAt, burstCount: w.burstCount, burstDmg: w.burstDmg });
    } else if (w.type === 'chain') {
      pushBullet(player, baseA, w);
    } else {
      pushBullet(player, baseA, w);
    }

    state.screenShake = Math.max(state.screenShake, w.type === 'rail' ? 6 : 2);
  }

  function pushBullet(from, a, w, extra) {
    var b = {
      x: from.x + Math.cos(a) * 22,
      y: from.y + Math.sin(a) * 22,
      vx: Math.cos(a) * w.speed,
      vy: Math.sin(a) * w.speed,
      r: w.r, dmg: w.dmg, color: w.accent, life: w.life,
      type: w.type, aoe: w.aoe || 0
    };
    if (extra) for (var k in extra) b[k] = extra[k];
    bullets.push(b);
  }

  /* ═══════════════ DAMAGE ═══════════════ */
  function damageEnemy(e, idx, dmg) {
    e.hp -= dmg;
    e.hitFlash = 0.08;
    floatTexts.push({ x: e.x + rand(-8, 8), y: e.y - e.r - 8, text: '-' + Math.round(dmg), color: '#eeeaff', life: 0.7, max: 0.7 });
    spawnParticles(e.x, e.y, e.color, Math.min(6, Math.ceil(dmg / 8)));
    state.screenShake = Math.max(state.screenShake, dmg > 25 ? 3 : 1);

    if (e.hp <= 0) {
      enemies.splice(idx, 1);
      state.kills++;
      state.combo++;
      state.comboTimer = 2.2;
      var gain = Math.round(6 * (e.type === 'brute' ? 3 : e.type === 'sprinter' ? 2 : 1) * (1 + Math.min(state.combo, 10) * 0.05));
      state.score += gain;
      player.focus = clamp(player.focus + 5, 0, player.maxFocus);
      spawnParticles(e.x, e.y, e.color, 20);
      shockwaves.push({ x: e.x, y: e.y, color: e.color, r: 8, life: 0.4, max: 0.4, speed: 280 });
      floatTexts.push({ x: e.x, y: e.y - 20, text: '+' + gain, color: '#ffd76b', life: 0.7, max: 0.7 });
    }
  }

  function hurtPlayer(amount) {
    player.hp -= amount;
    player.invuln = 0.4;
    $('vignette').style.opacity = '0.9';
    var f = $('flash');
    f.style.transition = 'none';
    f.style.opacity = '0.35';
    requestAnimationFrame(function () {
      f.style.transition = 'opacity 0.35s ease';
      f.style.opacity = '0';
    });
    state.screenShake = Math.max(state.screenShake, 6);
    if (player.hp <= 0) die();
  }

  /* ═══════════════ PARTICLES ═══════════════ */
  function spawnParticles(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      var a = rand(0, Math.PI * 2);
      var sp = rand(60, 320);
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: rand(0.25, 0.6), maxLife: 0.6,
        color: color, r: rand(1.5, 3.5)
      });
    }
  }

  /* ═══════════════ UPDATE ═══════════════ */
  function update(dt) {
    if (state.paused || state.dead) return;

    state.elapsed += dt;
    state.comboTimer -= dt;
    if (state.comboTimer <= 0) state.combo = 0;
    state.screenShake = Math.max(0, state.screenShake - dt * 18);

    /* Movement */
    var mx = 0, my = 0;
    if (keys['w'] || keys['arrowup']) my -= 1;
    if (keys['s'] || keys['arrowdown']) my += 1;
    if (keys['a'] || keys['arrowleft']) mx -= 1;
    if (keys['d'] || keys['arrowright']) mx += 1;
    if (mx || my) {
      var len = Math.hypot(mx, my);
      mx /= len; my /= len;
      player.moveAngle = Math.atan2(my, mx);
    }

    if (player.dashTime > 0) {
      player.dashTime -= dt;
      movePlayer(player.dashVX * dt, player.dashVY * dt);
    } else {
      movePlayer(mx * player.speed * dt, my * player.speed * dt);
    }

    if (player.dashCd > 0) player.dashCd -= dt;
    if (player.invuln > 0) player.invuln -= dt;

    /* Regen */
    player.focus = clamp(player.focus + 12 * dt, 0, player.maxFocus);
    if (player.hp < player.maxHp) player.hp = clamp(player.hp + 4 * dt, 0, player.maxHp);

    /* Camera */
    camera.x += (player.x - W / 2 - camera.x) * Math.min(1, dt * 8);
    camera.y += (player.y - H / 2 - camera.y) * Math.min(1, dt * 8);

    /* Firing */
    fireTimer -= dt;
    var w = weapons[weaponIndex];
    if (mouse.down && fireTimer <= 0 && w) {
      if (w.cost === 0 || player.focus >= w.cost) {
        player.focus -= w.cost || 0;
        fireWeapon(w);
        fireTimer = w.cd;
      }
    }

    /* Player bullets */
    for (var i = bullets.length - 1; i >= 0; i--) {
      var b = bullets[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;

      if (b.type === 'flak' && b.burstAt != null) {
        b.burstAt -= dt;
        if (b.burstAt <= 0) {
          for (var k = 0; k < b.burstCount; k++) {
            var aa = (k / b.burstCount) * Math.PI * 2 + rand(-0.2, 0.2);
            bullets.push({
              x: b.x, y: b.y,
              vx: Math.cos(aa) * 420, vy: Math.sin(aa) * 420,
              r: 3, dmg: b.burstDmg, color: b.color, life: 0.5,
              type: 'pellet', aoe: 0
            });
          }
          shockwaves.push({ x: b.x, y: b.y, color: b.color, r: 8, life: 0.3, max: 0.3, speed: 400 });
          bullets.splice(i, 1);
          continue;
        }
      }

      if (b.life <= 0 || b.x < 0 || b.x > WORLD_W || b.y < 0 || b.y > WORLD_H) {
        bullets.splice(i, 1);
        continue;
      }

      /* Hit enemies */
      for (var j = enemies.length - 1; j >= 0; j--) {
        var e = enemies[j];
        if (dist2(b.x, b.y, e.x, e.y) < (b.r + e.r) * (b.r + e.r)) {
          damageEnemy(e, j, b.dmg);
          if (b.aoe) {
            for (var k2 = enemies.length - 1; k2 >= 0; k2--) {
              var e2 = enemies[k2];
              if (e2 && dist2(b.x, b.y, e2.x, e2.y) < b.aoe * b.aoe) damageEnemy(e2, k2, b.dmg * 0.5);
            }
            shockwaves.push({ x: b.x, y: b.y, color: b.color, r: 10, life: 0.4, max: 0.4, speed: 400 });
          }
          spawnParticles(b.x, b.y, b.color, 6);
          if (!b.pierce) { bullets.splice(i, 1); }
          else b.pierce--;
          break;
        }
      }
    }

    /* Enemy bullets */
    for (var i2 = enemyBullets.length - 1; i2 >= 0; i2--) {
      var eb = enemyBullets[i2];
      eb.x += eb.vx * dt;
      eb.y += eb.vy * dt;
      eb.life -= dt;
      if (eb.life <= 0) { enemyBullets.splice(i2, 1); continue; }
      if (player.invuln <= 0 && dist2(eb.x, eb.y, player.x, player.y) < (eb.r + player.r) * (eb.r + player.r)) {
        hurtPlayer(eb.dmg);
        enemyBullets.splice(i2, 1);
      }
    }

    /* Wells */
    for (var iw = wells.length - 1; iw >= 0; iw--) {
      var wl = wells[iw];
      wl.age += dt;
      wl.life -= dt;
      wl.r = Math.min(wl.maxR, wl.age * 90);
      if (wl.life <= 0) { wells.splice(iw, 1); continue; }
      for (var jw = enemies.length - 1; jw >= 0; jw--) {
        var ew = enemies[jw];
        var d = Math.sqrt(dist2(wl.x, wl.y, ew.x, ew.y));
        if (d < wl.r + 140) {
          var aw = Math.atan2(wl.y - ew.y, wl.x - ew.x);
          var pull = wl.pullForce * dt * clamp(1 - d / 320, 0.15, 1);
          ew.x += Math.cos(aw) * pull;
          ew.y += Math.sin(aw) * pull;
        }
        if (d < wl.r * 0.6) damageEnemy(ew, jw, wl.dps * dt);
      }
    }

    /* Mines */
    for (var im = mines.length - 1; im >= 0; im--) {
      var m = mines[im];
      m.life -= dt;
      if (m.life <= 0) { mines.splice(im, 1); continue; }
      for (var jm = enemies.length - 1; jm >= 0; jm--) {
        var em = enemies[jm];
        if (dist2(m.x, m.y, em.x, em.y) < (m.r + em.r + 6) * (m.r + em.r + 6)) {
          for (var k3 = enemies.length - 1; k3 >= 0; k3--) {
            var e3 = enemies[k3];
            if (e3 && dist2(m.x, m.y, e3.x, e3.y) < m.aoe * m.aoe) damageEnemy(e3, k3, m.dmg);
          }
          shockwaves.push({ x: m.x, y: m.y, color: m.color, r: 10, life: 0.4, max: 0.4, speed: 400 });
          spawnParticles(m.x, m.y, m.color, 20);
          mines.splice(im, 1);
          break;
        }
      }
    }

    /* Beams */
    for (var ib = beams.length - 1; ib >= 0; ib--) {
      beams[ib].life -= dt;
      if (beams[ib].life <= 0) beams.splice(ib, 1);
    }

    /* Enemy spawn */
    if (state.enemiesToSpawn > 0) {
      state.spawnTimer -= dt;
      if (state.spawnTimer <= 0) {
        spawnEnemy();
        state.enemiesToSpawn--;
        state.spawnTimer = state.spawnInterval;
      }
    } else if (enemies.length === 0) {
      nextWave();
    }

    /* Enemy AI */
    for (var ie = enemies.length - 1; ie >= 0; ie--) {
      var en = enemies[ie];
      if (en.hitFlash > 0) en.hitFlash -= dt;
      var a = Math.atan2(player.y - en.y, player.x - en.x);
      var speed = en.speed;

      if (en.type === 'shooter') {
        var d2 = dist2(en.x, en.y, player.x, player.y);
        if (d2 > 300 * 300) {
          en.x += Math.cos(a) * speed * dt;
          en.y += Math.sin(a) * speed * dt;
        } else if (d2 < 180 * 180) {
          en.x -= Math.cos(a) * speed * 0.55 * dt;
          en.y -= Math.sin(a) * speed * 0.55 * dt;
        }
        en.shootCd -= dt;
        if (en.shootCd <= 0 && d2 < 850 * 850) {
          enemyBullets.push({
            x: en.x + Math.cos(a) * 20,
            y: en.y + Math.sin(a) * 20,
            vx: Math.cos(a) * 380,
            vy: Math.sin(a) * 380,
            r: 5, dmg: en.dmg, color: '#ff4d7a', life: 2.2
          });
          en.shootCd = 1.25;
        }
      } else {
        en.x += Math.cos(a) * speed * dt;
        en.y += Math.sin(a) * speed * dt;
      }

      en.x = clamp(en.x, en.r, WORLD_W - en.r);
      en.y = clamp(en.y, en.r, WORLD_H - en.r);

      if (dist2(en.x, en.y, player.x, player.y) < (en.r + player.r) * (en.r + player.r)) {
        if (player.invuln <= 0) hurtPlayer(en.dmg);
        var push = 8;
        en.x -= Math.cos(a) * push;
        en.y -= Math.sin(a) * push;
      }
    }

    /* Particles */
    for (var ip = particles.length - 1; ip >= 0; ip--) {
      var p = particles[ip];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.92;
      p.vy *= 0.92;
      p.life -= dt;
      if (p.life <= 0) particles.splice(ip, 1);
    }

    /* Shockwaves */
    for (var is = shockwaves.length - 1; is >= 0; is--) {
      var sw = shockwaves[is];
      sw.r += sw.speed * dt;
      sw.life -= dt;
      if (sw.life <= 0) shockwaves.splice(is, 1);
    }

    /* Float texts */
    for (var ift = floatTexts.length - 1; ift >= 0; ift--) {
      var ft = floatTexts[ift];
      ft.y -= 34 * dt;
      ft.life -= dt;
      if (ft.life <= 0) floatTexts.splice(ift, 1);
    }

    /* Vignette fade */
    var v = $('vignette');
    var cur = parseFloat(v.style.opacity) || 0;
    v.style.opacity = String(Math.max(0, cur - dt * 3.5));
  }

  function nextWave() {
    state.wave++;
    state.enemiesToSpawn = Math.min(40, 5 + state.wave * 3);
    state.spawnInterval = clamp(1.4 - state.wave * 0.08, 0.35, 1.4);
    $('waveText').textContent = 'Wave ' + state.wave;
  }

  function die() {
    if (state.dead) return;
    state.dead = true;

    /* Award XP + credits */
    var xpGain = Math.round(state.kills * 3 + state.score * 0.25);
    var credGain = Math.round(state.score * 0.06 + state.kills * 1.5);

    op.xp = (op.xp || 0) + xpGain;
    op.credits = (op.credits || 0) + credGain;
    var s = op.stats;
    s.runs++;
    s.kills += state.kills;
    s.totalKills += state.kills;
    s.totalTime += state.elapsed;
    s.totalScore += state.score;
    s.deaths++;
    if (state.score > s.bestScore) s.bestScore = state.score;
    if (state.wave > s.bestWave) s.bestWave = state.wave;
    if (!op.history) op.history = [];
    op.history.unshift({
      mode: op.settings.mode === 'endless' ? 'ENDLESS' : 'CAMPAIGN',
      level: 1, score: state.score, wave: state.wave, kills: state.kills,
      time: Math.round(state.elapsed), won: false, difficulty: 0, date: Date.now()
    });
    if (op.history.length > 25) op.history.length = 25;
    writeSave(save);

    $('finalScore').textContent = state.score;
    $('finalWave').textContent = state.wave;
    $('finalKills').textContent = state.kills;
    $('finalTime').textContent = fmtTime(state.elapsed);
    $('rewardLine').textContent = '+' + xpGain + ' XP  ·  +₡' + credGain;
    $('deathOverlay').classList.add('active');
  }

  /* ═══════════════ RENDER ═══════════════ */
  function render() {
    ctx.clearRect(0, 0, W, H);

    /* Background */
    var bg = ctx.createRadialGradient(W * 0.5, H * 0.45, 10, W * 0.5, H * 0.45, Math.max(W, H) * 0.8);
    bg.addColorStop(0, '#140d0d');
    bg.addColorStop(1, '#050505');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    var sx = 0, sy = 0;
    if (state.screenShake > 0) {
      sx = rand(-state.screenShake, state.screenShake);
      sy = rand(-state.screenShake, state.screenShake);
    }

    ctx.save();
    ctx.translate(-camera.x + sx, -camera.y + sy);

    /* Arena bounds */
    ctx.strokeStyle = 'rgba(139,26,26,0.4)';
    ctx.lineWidth = 3;
    ctx.strokeRect(0, 0, WORLD_W, WORLD_H);

    /* Grid */
    ctx.strokeStyle = 'rgba(139,26,26,0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var gx = 0; gx <= WORLD_W; gx += 100) {
      ctx.moveTo(gx, 0);
      ctx.lineTo(gx, WORLD_H);
    }
    for (var gy = 0; gy <= WORLD_H; gy += 100) {
      ctx.moveTo(0, gy);
      ctx.lineTo(WORLD_W, gy);
    }
    ctx.stroke();

    /* Wells */
    wells.forEach(function (w) {
      var g = ctx.createRadialGradient(w.x, w.y, 0, w.x, w.y, w.r + 40);
      g.addColorStop(0, '#000');
      g.addColorStop(0.4, 'rgba(183,145,255,0.7)');
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(w.x, w.y, w.r + 40, 0, 7);
      ctx.fill();
    });

    /* Mines */
    mines.forEach(function (m) {
      var pulse = 0.6 + 0.4 * Math.sin(performance.now() * 0.012);
      ctx.strokeStyle = m.color;
      ctx.lineWidth = 2;
      ctx.shadowColor = m.color;
      ctx.shadowBlur = 16 * pulse;
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r * pulse, 0, 7);
      ctx.stroke();
      ctx.shadowBlur = 0;
    });

    /* Enemies */
    enemies.forEach(function (e) {
      ctx.save();
      ctx.translate(e.x, e.y);

      /* Accent glow */
      var gl = ctx.createRadialGradient(0, 0, e.r * 0.4, 0, 0, e.r * 3);
      gl.addColorStop(0, e.color + '44');
      gl.addColorStop(1, 'transparent');
      ctx.fillStyle = gl;
      ctx.fillRect(-e.r * 3, -e.r * 3, e.r * 6, e.r * 6);

      ctx.fillStyle = e.hitFlash > 0 ? '#fff' : e.color;
      ctx.strokeStyle = 'rgba(255,255,255,0.7)';
      ctx.lineWidth = 1.5;
      ctx.shadowColor = e.color;
      ctx.shadowBlur = 12;

      if (e.type === 'brute') {
        ctx.beginPath();
        ctx.arc(0, 0, e.r, 0, 7);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#2a0c1c';
        ctx.beginPath();
        ctx.arc(0, 0, e.r * 0.55, 0, 7);
        ctx.fill();
      } else if (e.type === 'sprinter') {
        ctx.beginPath();
        for (var i = 0; i < 3; i++) {
          var a = i / 3 * Math.PI * 2 - Math.PI / 2;
          if (i) ctx.lineTo(Math.cos(a) * e.r * 1.3, Math.sin(a) * e.r * 1.3);
          else ctx.moveTo(Math.cos(a) * e.r * 1.3, Math.sin(a) * e.r * 1.3);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      } else if (e.type === 'shooter') {
        ctx.beginPath();
        for (var i2 = 0; i2 < 4; i2++) {
          var a2 = i2 / 4 * Math.PI * 2 + Math.PI / 4;
          if (i2) ctx.lineTo(Math.cos(a2) * e.r * 1.2, Math.sin(a2) * e.r * 1.2);
          else ctx.moveTo(Math.cos(a2) * e.r * 1.2, Math.sin(a2) * e.r * 1.2);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      } else {
        ctx.beginPath();
        for (var i3 = 0; i3 < 6; i3++) {
          var a3 = i3 / 6 * Math.PI * 2;
          if (i3) ctx.lineTo(Math.cos(a3) * e.r, Math.sin(a3) * e.r);
          else ctx.moveTo(Math.cos(a3) * e.r, Math.sin(a3) * e.r);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }
      ctx.shadowBlur = 0;
      ctx.restore();

      /* HP bar */
      if (e.hp < e.maxHp) {
        var w2 = e.r * 2.2;
        var y2 = e.y - e.r - 14;
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(e.x - w2 / 2 - 1, y2 - 1, w2 + 2, 5);
        ctx.fillStyle = '#ff3a3a';
        ctx.fillRect(e.x - w2 / 2, y2, w2 * clamp(e.hp / e.maxHp, 0, 1), 3);
      }
    });

    /* Player bullets */
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    bullets.forEach(function (b) {
      var tl = 0.045;
      ctx.strokeStyle = b.color;
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 12;
      ctx.globalAlpha = 0.6;
      ctx.lineWidth = b.r * 1.7;
      ctx.beginPath();
      ctx.moveTo(b.x - b.vx * tl, b.y - b.vy * tl);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r * 0.8, 0, 7);
      ctx.fill();
    });
    ctx.globalCompositeOperation = 'source-over';
    ctx.shadowBlur = 0;

    /* Enemy bullets */
    ctx.globalCompositeOperation = 'lighter';
    enemyBullets.forEach(function (b) {
      ctx.strokeStyle = b.color;
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 12;
      ctx.globalAlpha = 0.6;
      ctx.lineWidth = b.r * 1.6;
      ctx.beginPath();
      ctx.moveTo(b.x - b.vx * 0.03, b.y - b.vy * 0.03);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r * 0.7, 0, 7);
      ctx.fill();
    });
    ctx.globalCompositeOperation = 'source-over';
    ctx.shadowBlur = 0;

    /* Beams */
    ctx.globalCompositeOperation = 'lighter';
    beams.forEach(function (b) {
      ctx.globalAlpha = clamp(b.life / 0.15, 0, 1);
      ctx.strokeStyle = b.color;
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 22;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(b.x1, b.y1);
      ctx.lineTo(b.x2, b.y2);
      ctx.stroke();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = '#fff';
      ctx.stroke();
    });
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = 'source-over';

    /* Particles */
    ctx.globalCompositeOperation = 'lighter';
    particles.forEach(function (p) {
      ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (0.5 + p.life / p.maxLife), 0, 7);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    /* Player */
    if (!state.dead) {
      var t = { x: mouse.x + camera.x, y: mouse.y + camera.y };
      var a = Math.atan2(t.y - player.y, t.x - player.x);

      ctx.save();
      ctx.translate(player.x, player.y);

      /* Player glow */
      var pg = ctx.createRadialGradient(0, 0, 0, 0, 0, 120);
      pg.addColorStop(0, skin.accent + '30');
      pg.addColorStop(1, 'transparent');
      ctx.fillStyle = pg;
      ctx.fillRect(-120, -120, 240, 240);

      ctx.rotate(a);

      /* Thrust flame */
      if (player.moveAngle != null || player.dashTime > 0) {
        var fl = 12 + Math.random() * 8 + (player.dashTime > 0 ? 14 : 0);
        ctx.fillStyle = skin.accent;
        ctx.shadowColor = skin.accent;
        ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.moveTo(-12, -6);
        ctx.lineTo(-12 - fl, 0);
        ctx.lineTo(-12, 6);
        ctx.closePath();
        ctx.fill();
      }

      ctx.globalAlpha = player.invuln > 0 ? (0.55 + 0.3 * Math.sin(performance.now() / 40)) : 1;
      ctx.fillStyle = skin.body;
      ctx.strokeStyle = skin.accent;
      ctx.lineWidth = 2.5;
      ctx.shadowColor = skin.accent;
      ctx.shadowBlur = 20;

      if (skin.shape === 'circle') {
        ctx.beginPath();
        ctx.arc(0, 0, 15, 0, 7);
        ctx.fill();
        ctx.stroke();
      } else if (skin.shape === 'square') {
        ctx.fillRect(-14, -14, 28, 28);
        ctx.strokeRect(-14, -14, 28, 28);
      } else if (skin.shape === 'hex') {
        ctx.beginPath();
        for (var k = 0; k < 6; k++) {
          var ka = k / 6 * Math.PI * 2;
          if (k) ctx.lineTo(Math.cos(ka) * 16, Math.sin(ka) * 16);
          else ctx.moveTo(Math.cos(ka) * 16, Math.sin(ka) * 16);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.moveTo(20, 0);
        ctx.lineTo(0, 16);
        ctx.lineTo(-16, 0);
        ctx.lineTo(0, -16);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }

      ctx.fillStyle = skin.accent;
      ctx.fillRect(8, -3, 16, 6);
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath();
      ctx.arc(-2, 0, 4, 0, 7);
      ctx.fill();

      ctx.globalAlpha = 1;
      if (player.invuln > 0) {
        ctx.strokeStyle = skin.accent + 'aa';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 25, 0, 7);
        ctx.stroke();
      }
      ctx.restore();
    }

    /* Shockwaves */
    ctx.globalCompositeOperation = 'lighter';
    shockwaves.forEach(function (q) {
      ctx.globalAlpha = clamp(q.life / q.max, 0, 1);
      ctx.strokeStyle = q.color;
      ctx.lineWidth = 2 + q.life * 6;
      ctx.shadowColor = q.color;
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.arc(q.x, q.y, q.r, 0, 7);
      ctx.stroke();
    });
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = 'source-over';

    /* Float texts */
    floatTexts.forEach(function (f) {
      ctx.globalAlpha = clamp(f.life / f.max, 0, 1);
      ctx.font = '700 15px Orbitron, sans-serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(5,5,5,0.8)';
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
    });
    ctx.globalAlpha = 1;

    ctx.restore();

    /* Draw minimap */
    drawMinimap();
  }

  function drawMinimap() {
    var mw = mmCanvas.width, mh = mmCanvas.height;
    mmCtx.clearRect(0, 0, mw, mh);
    mmCtx.fillStyle = 'rgba(5,5,5,0.6)';
    mmCtx.fillRect(0, 0, mw, mh);

    var sx = mw / WORLD_W, sy = mh / WORLD_H;

    /* Grid */
    mmCtx.strokeStyle = 'rgba(139,26,26,0.15)';
    mmCtx.lineWidth = 1;
    mmCtx.beginPath();
    for (var x = 0; x <= mw; x += 40) { mmCtx.moveTo(x, 0); mmCtx.lineTo(x, mh); }
    for (var y = 0; y <= mh; y += 40) { mmCtx.moveTo(0, y); mmCtx.lineTo(mw, y); }
    mmCtx.stroke();

    /* Enemies */
    enemies.forEach(function (e) {
      mmCtx.fillStyle = e.color;
      mmCtx.beginPath();
      mmCtx.arc(e.x * sx, e.y * sy, e.type === 'brute' ? 4 : 2.5, 0, 7);
      mmCtx.fill();
    });

    /* Player */
    mmCtx.save();
    mmCtx.translate(player.x * sx, player.y * sy);
    var t = { x: mouse.x + camera.x, y: mouse.y + camera.y };
    mmCtx.rotate(Math.atan2(t.y - player.y, t.x - player.x));
    mmCtx.fillStyle = skin.accent;
    mmCtx.shadowColor = skin.accent;
    mmCtx.shadowBlur = 10;
    mmCtx.beginPath();
    mmCtx.moveTo(7, 0);
    mmCtx.lineTo(-4, 5);
    mmCtx.lineTo(-4, -5);
    mmCtx.closePath();
    mmCtx.fill();
    mmCtx.restore();
  }

  /* ═══════════════ HUD UPDATE ═══════════════ */
  function updateHud() {
    $('hpBar').style.width = clamp(100 * player.hp / player.maxHp, 0, 100) + '%';
    $('hpText').textContent = Math.max(0, Math.round(player.hp)) + '/' + player.maxHp;
    $('focusBar').style.width = clamp(100 * player.focus / player.maxFocus, 0, 100) + '%';
    $('focusText').textContent = Math.round(player.focus) + '/' + player.maxFocus;
    $('hpBar').classList.toggle('low', player.hp / player.maxHp < 0.3);
    $('scoreText').textContent = state.score;
    $('timerText').textContent = fmtTime(state.elapsed);
    $('waveText').textContent = 'Wave ' + state.wave;

    var cb = $('comboText');
    if (state.combo >= 3) {
      cb.textContent = '×' + (1 + Math.min(state.combo, 10) * 0.05).toFixed(2) + ' COMBO · ' + state.combo;
      cb.style.opacity = String(Math.min(1, state.comboTimer / 0.6));
    } else {
      cb.style.opacity = '0';
    }
  }

  function renderWeaponBar() {
    var bar = $('weaponSlots');
    bar.innerHTML = '';
    weapons.forEach(function (w, i) {
      var slot = document.createElement('div');
      slot.className = 'wslot' + (i === weaponIndex ? ' active' : '');
      slot.innerHTML = '<span class="wslot-key">' + (i + 1) + '</span><span class="wslot-glyph">' + w.glyph + '</span>';
      slot.addEventListener('click', function () { switchWeapon(i); });
      bar.appendChild(slot);
    });
    var w = weapons[weaponIndex];
    $('weaponName').textContent = w.name;
    $('weaponSub').textContent = w.cost ? ('Focus · ' + w.cost) : 'Focus · Free';
  }

  function switchWeapon(i) {
    if (i < 0 || i >= weapons.length) return;
    weaponIndex = i;
    renderWeaponBar();
  }

  /* ═══════════════ INPUT ═══════════════ */
  window.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    keys[k] = true;
    if (/^[1-8]$/.test(e.key)) {
      var idx = parseInt(e.key, 10) - 1;
      if (idx < weapons.length) switchWeapon(idx);
    }
    if (e.key === 'Shift' && !state.paused && !state.dead) tryDash();
    if (e.code === 'Space' || e.key === ' ' || e.key === 'Escape') {
      e.preventDefault();
      if (!state.dead) togglePause();
    }
  });
  window.addEventListener('keyup', function (e) {
    keys[e.key.toLowerCase()] = false;
  });

  window.addEventListener('mousemove', function (e) {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    var dot = $('cursorDot');
    dot.style.left = e.clientX + 'px';
    dot.style.top = e.clientY + 'px';
  });
  window.addEventListener('mousedown', function (e) {
    if (e.button === 0) mouse.down = true;
    if (e.button === 2 && !state.paused && !state.dead) tryDash();
  });
  window.addEventListener('mouseup', function (e) {
    if (e.button === 0) mouse.down = false;
  });
  window.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  /* Touch fallback — tap to shoot, drag to aim */
  window.addEventListener('touchstart', function (e) {
    if (e.touches.length) {
      mouse.x = e.touches[0].clientX;
      mouse.y = e.touches[0].clientY;
      mouse.down = true;
    }
  }, { passive: true });
  window.addEventListener('touchmove', function (e) {
    if (e.touches.length) {
      mouse.x = e.touches[0].clientX;
      mouse.y = e.touches[0].clientY;
    }
  }, { passive: true });
  window.addEventListener('touchend', function () { mouse.down = false; }, { passive: true });

  function tryDash() {
    if (player.dashCd > 0 || player.dashTime > 0) return;
    var t = { x: mouse.x + camera.x, y: mouse.y + camera.y };
    var a = player.moveAngle != null ? player.moveAngle : Math.atan2(t.y - player.y, t.x - player.x);
    player.dashVX = Math.cos(a) * 1500;
    player.dashVY = Math.sin(a) * 1500;
    player.dashTime = 0.16;
    player.invuln = 0.24;
    player.dashCd = 2.4;
    spawnParticles(player.x, player.y, '#c8d0ee', 20);
    shockwaves.push({ x: player.x, y: player.y, color: '#6feaff', r: 12, life: 0.4, max: 0.4, speed: 280 });
  }

  function togglePause() {
    if (state.dead) return;
    state.paused = !state.paused;
    $('pauseOverlay').classList.toggle('active', state.paused);
  }

  /* ═══════════════ WIRING ═══════════════ */
  $('resumeBtn').addEventListener('click', function () { if (state.paused) togglePause(); });
  $('abortBtn').addEventListener('click', function () {
    if (!confirm('Abort this run? Progress will not be recorded.')) return;
    window.location.href = 'app.html';
  });
  $('retryBtn').addEventListener('click', function () { window.location.reload(); });

  /* ═══════════════ BOOT ═══════════════ */
  player = makePlayer();
  camera.x = player.x - W / 2;
  camera.y = player.y - H / 2;
  renderWeaponBar();
  nextWave();
  state.running = true;

  /* Mission label */
  $('missionName').textContent = 'Predator 01';
  if (op.settings.mode === 'endless') {
    $('missionName').textContent = 'Endless Loop';
  }

  var lastT = performance.now();
  function loop(now) {
    var dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;
    update(dt);
    render();
    updateHud();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  console.log('Play booted for', op.name, '· weapons:', weapons.map(function (w) { return w.name; }).join(', '));
})();
</script>
</body>
